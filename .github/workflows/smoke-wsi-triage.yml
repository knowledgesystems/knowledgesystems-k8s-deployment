name: Smoke test WSI triage route

on:
  workflow_dispatch:
    inputs:
      url:
        description: Base URL including /wsi
        required: true
        default: https://beta.cbioportal.mskcc.org/wsi
        type: string
      origin:
        description: Browser origin used for the CORS preflight
        required: true
        default: https://beta.cbioportal.mskcc.org
        type: string
      release_id:
        description: Expected immutable WSI release ID
        required: true
        default: beta-wsi-v2-20260915-1
        type: string
      tile_git_sha:
        description: Expected tile-server Git SHA
        required: true
        default: d406b94a8bcc692907b55e2eeffd05ce5759a1fa
        type: string

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run WSI routing smoke
        env:
          CBIOPORTAL_WSI_URL: ${{ inputs.url }}
          CBIOPORTAL_WSI_ORIGIN: ${{ inputs.origin }}
          EXPECTED_WSI_RELEASE_ID: ${{ inputs.release_id }}
          EXPECTED_WSI_TILE_GIT_SHA: ${{ inputs.tile_git_sha }}
        run: bash .github/scripts/smoke_wsi_triage.sh
