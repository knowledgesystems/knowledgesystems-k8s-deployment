name: Slide Viewer Triage Routing Smoke Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  routing-smoke:
    name: Verify isolated triage WSI routes
    runs-on: ubuntu-latest
    steps:
      - name: Check out deployment repository
        uses: actions/checkout@v4

      - name: Exercise triage beta nginx routes
        env:
          CBIOPORTAL_URL: https://triage-beta.cbioportal.aws.mskcc.org
        run: tests/smoke/slide-viewer-routing.sh
