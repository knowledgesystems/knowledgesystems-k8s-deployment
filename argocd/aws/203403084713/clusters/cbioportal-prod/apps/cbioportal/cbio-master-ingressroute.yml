apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: cbioportal-master-ingressroute
  namespace: default
  labels:
    app.kubernetes.io/instance: cbioportal
spec:
  entryPoints:
    - websecure
  routes:
    # Expensive bulk-data endpoints: add per-IP rate limit
    - match: >-
        Host(`master.cbioportal.org`) && (PathRegexp(`^/api/studies/[^/]+/clinical-events`) || PathRegexp(`^/api/molecular-profiles/[^/]+/discrete-copy-number/fetch`))
      kind: Rule
      priority: 100
      middlewares:
        - name: ipblock
          namespace: default
        - name: ratelimit-heavy
          namespace: default
      services:
        - name: cbioportal-backend-master-green
          port: 80
    - match: Host(`master.cbioportal.org`)
      kind: Rule
      priority: 50
      middlewares:
        - name: ipblock
          namespace: default
      services:
        - name: cbioportal-backend-master-green
          port: 80
  tls:
    secretName: master-cbio-cert
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: master-cbio-cert
  namespace: default
  labels:
    app.kubernetes.io/instance: cbioportal
spec:
  secretName: master-cbio-cert
  dnsNames:
    - master.cbioportal.org
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
    group: cert-manager.io
  usages:
    - digital signature
    - key encipherment
