apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: cbioportal-www-ingressroute
  namespace: default
  labels:
    app.kubernetes.io/instance: cbioportal
spec:
  entryPoints:
    - websecure
  routes:
    # Patient-page crawler fingerprint: forged Google referer with Sec-Fetch-Site "none"
    # (a real click-through sends "cross-site") and no cookies. Blocking the landing page
    # stops the frontend from loading and fanning out to the patient API calls.
    - match: >-
        Host(`www.cbioportal.org`) && Path(`/patient`) && Header(`User-Agent`, `Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/154.0.0.0 Safari/537.36`) && Header(`Referer`, `https://www.google.com/`) && Header(`Sec-Fetch-Site`, `none`) && !HeaderRegexp(`Cookie`, `.+`)
      kind: Rule
      priority: 300
      middlewares:
        - name: uablock-patient-crawler
          namespace: default
      services:
        - name: cbioportal-backend-public-blue
          port: 80
    # Same two clinical-events routes for requests proxied by Cloudflare: the
    # connection IP is a Cloudflare edge (IPv4 ranges from
    # https://www.cloudflare.com/ips/; the origin ELB is IPv4-only), so the
    # rate limit keys on CF-Connecting-IP instead. ipblock does not apply here;
    # its list is mirrored as a Cloudflare WAF rule that blocks at the edge.
    - match: >-
        Host(`www.cbioportal.org`) && HeaderRegexp(`User-Agent`, `Mozilla`) && !HeaderRegexp(`User-Agent`, `(?i)(headless|kprofile-pipeline)`) && PathRegexp(`^/api/studies/[^/]+/clinical-events`) && (ClientIP(`173.245.48.0/20`) || ClientIP(`103.21.244.0/22`) || ClientIP(`103.22.200.0/22`) || ClientIP(`103.31.4.0/22`) || ClientIP(`141.101.64.0/18`) || ClientIP(`108.162.192.0/18`) || ClientIP(`190.93.240.0/20`) || ClientIP(`188.114.96.0/20`) || ClientIP(`197.234.240.0/22`) || ClientIP(`198.41.128.0/17`) || ClientIP(`162.158.0.0/15`) || ClientIP(`104.16.0.0/13`) || ClientIP(`104.24.0.0/14`) || ClientIP(`172.64.0.0/13`) || ClientIP(`131.0.72.0/22`))
      kind: Rule
      priority: 201
      middlewares:
        - name: ratelimit-heavy-cloudflare
          namespace: default
      services:
        - name: cbioportal-backend-public-blue
          port: 80
    - match: >-
        Host(`www.cbioportal.org`) && PathRegexp(`^/api/studies/[^/]+/clinical-events`) && (ClientIP(`173.245.48.0/20`) || ClientIP(`103.21.244.0/22`) || ClientIP(`103.22.200.0/22`) || ClientIP(`103.31.4.0/22`) || ClientIP(`141.101.64.0/18`) || ClientIP(`108.162.192.0/18`) || ClientIP(`190.93.240.0/20`) || ClientIP(`188.114.96.0/20`) || ClientIP(`197.234.240.0/22`) || ClientIP(`198.41.128.0/17`) || ClientIP(`162.158.0.0/15`) || ClientIP(`104.16.0.0/13`) || ClientIP(`104.24.0.0/14`) || ClientIP(`172.64.0.0/13`) || ClientIP(`131.0.72.0/22`))
      kind: Rule
      priority: 191
      middlewares:
        - name: ratelimit-heavy-cloudflare
          namespace: default
      services:
        - name: cbioportal-backend-public-api-blue
          port: 80
    # Study-wide clinical-events (bulk/API only; the UI does not call this): per-IP rate limit
    - match: >-
        Host(`www.cbioportal.org`) && HeaderRegexp(`User-Agent`, `Mozilla`) && !HeaderRegexp(`User-Agent`, `(?i)(headless|kprofile-pipeline)`) && PathRegexp(`^/api/studies/[^/]+/clinical-events`)
      kind: Rule
      priority: 200
      middlewares:
        - name: ipblock
          namespace: default
        - name: ratelimit-heavy
          namespace: default
      services:
        - name: cbioportal-backend-public-blue
          port: 80
    # Study-wide clinical-events (non-browser): per-IP rate limit
    - match: >-
        Host(`www.cbioportal.org`) && PathRegexp(`^/api/studies/[^/]+/clinical-events`)
      kind: Rule
      priority: 190
      middlewares:
        - name: ipblock
          namespace: default
        - name: ratelimit-heavy
          namespace: default
      services:
        - name: cbioportal-backend-public-api-blue
          port: 80
    # Browser traffic: User-Agent contains Mozilla
    - match: >-
        Host(`www.cbioportal.org`) && HeaderRegexp(`User-Agent`, `Mozilla`) && !HeaderRegexp(`User-Agent`, `(?i)(headless|kprofile-pipeline)`)
      kind: Rule
      priority: 100
      middlewares:
        - name: ipblock
          namespace: default
      services:
        - name: cbioportal-backend-public-blue
          port: 80
    # Non-browser traffic (catch-all). Served by the public API pool through
    # cbioportal-api-mirror-<color> (apps/cbioportal-api), which also sends a
    # share of these requests to cbioportal-go-api and discards its answers.
    - match: Host(`www.cbioportal.org`)
      kind: Rule
      priority: 50
      middlewares:
        - name: ipblock
          namespace: default
      services:
        - name: cbioportal-api-mirror-blue
          kind: TraefikService
  tls:
    secretName: www-cbioportal-cert
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: www-cbioportal-cert
  namespace: default
  labels:
    app.kubernetes.io/instance: cbioportal
spec:
  secretName: www-cbioportal-cert
  dnsNames:
    - www.cbioportal.org
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
    group: cert-manager.io
  usages:
    - digital signature
    - key encipherment
