apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: cbioportal-www-ingressroute
  namespace: default
  labels:
    app.kubernetes.io/instance: cbioportal
spec:
  entryPoints:
    - websecure
  routes:
    # Patient-page crawler fingerprint: forged Google referer with Sec-Fetch-Site "none"
    # (a real click-through sends "cross-site") and no cookies. Blocking the landing page
    # stops the frontend from loading and fanning out to the patient API calls.
    - match: >-
        Host(`www.cbioportal.org`) && Path(`/patient`) && Header(`User-Agent`, `Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/154.0.0.0 Safari/537.36`) && Header(`Referer`, `https://www.google.com/`) && Header(`Sec-Fetch-Site`, `none`) && !HeaderRegexp(`Cookie`, `.+`)
      kind: Rule
      priority: 300
      middlewares:
        - name: uablock-patient-crawler
          namespace: default
      services:
        - name: cbioportal-backend-public-green
          port: 80
    # Study-wide clinical-events (bulk/API only; the UI does not call this): per-IP rate limit
    - match: >-
        Host(`www.cbioportal.org`) && HeaderRegexp(`User-Agent`, `Mozilla`) && !HeaderRegexp(`User-Agent`, `(?i)(headless|kprofile-pipeline)`) && PathRegexp(`^/api/studies/[^/]+/clinical-events`)
      kind: Rule
      priority: 200
      middlewares:
        - name: ipblock
          namespace: default
        - name: ratelimit-heavy
          namespace: default
      services:
        - name: cbioportal-backend-public-green
          port: 80
    # Study-wide clinical-events (non-browser): per-IP rate limit
    - match: >-
        Host(`www.cbioportal.org`) && PathRegexp(`^/api/studies/[^/]+/clinical-events`)
      kind: Rule
      priority: 190
      middlewares:
        - name: ipblock
          namespace: default
        - name: ratelimit-heavy
          namespace: default
      services:
        - name: cbioportal-backend-public-api-green
          port: 80
    # Browser traffic: User-Agent contains Mozilla
    - match: >-
        Host(`www.cbioportal.org`) && HeaderRegexp(`User-Agent`, `Mozilla`) && !HeaderRegexp(`User-Agent`, `(?i)(headless|kprofile-pipeline)`)
      kind: Rule
      priority: 100
      middlewares:
        - name: ipblock
          namespace: default
      services:
        - name: cbioportal-backend-public-green
          port: 80
    # Non-browser traffic (catch-all)
    - match: Host(`www.cbioportal.org`)
      kind: Rule
      priority: 50
      middlewares:
        - name: ipblock
          namespace: default
      services:
        - name: cbioportal-backend-public-api-green
          port: 80
  tls:
    secretName: www-cbioportal-cert
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: www-cbioportal-cert
  namespace: default
  labels:
    app.kubernetes.io/instance: cbioportal
spec:
  secretName: www-cbioportal-cert
  dnsNames:
    - www.cbioportal.org
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
    group: cert-manager.io
  usages:
    - digital signature
    - key encipherment
