apiVersion: apps/v1
kind: Deployment
metadata:
  name: cbioagent-clickhouse-mcp-auth
  labels:
    run: cbioagent-clickhouse-mcp-auth
  annotations:
    # Reloader rolls this Deployment when the daily clone cron patches
    # clickhouse-mcp-active.CLICKHOUSE_DATABASE on a successful build,
    # when the Google OAuth client credentials rotate, and when the
    # session Redis password (cbioportal-public-blue) rotates.
    configmap.reloader.stakater.com/reload: "clickhouse-mcp-active"
    secret.reloader.stakater.com/reload: "cbioportal-mcp-google-oauth,cbioportal-public-blue"
    # Track the mutable `cbioportal/mcp:mcp-google-oauth` tag — every
    # push to the `mcp-google-oauth` branch on cbioportal/cbioportal-mcp
    # (or explicit `workflow_dispatch` builds against it) overwrites that
    # tag digest. Keel polls Docker Hub and rolls this Deployment when
    # the digest behind the tag changes. Same pattern beta LibreChat uses;
    # fine here because this Deployment is on a feature branch we're
    # actively iterating on. Swap to a versioned tag when we cut a
    # release.
    keel.sh/policy: force
    keel.sh/trigger: poll
    keel.sh/match-tag: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      run: cbioagent-clickhouse-mcp-auth
  template:
    metadata:
      labels:
        run: cbioagent-clickhouse-mcp-auth
    spec:
      containers:
        - name: cbioagent-clickhouse-mcp
          # Same image as the sibling `cbioagent-clickhouse-mcp`
          # (LibreChat-facing) Deployment. The OAuth code from
          # cbioportal-mcp#107 is inert unless CBIOPORTAL_MCP_GOOGLE_*
          # env vars are set — this Deployment sets them (via the
          # cbioportal-mcp-google-oauth Secret) and gets Google-OAuth
          # auth; the sibling doesn't and stays header-trust. Tracking
          # `:latest` (built from `main` on cbioportal/cbioportal-mcp)
          # keeps both Deployments in lockstep on the same binary;
          # Keel rolls both when the digest changes. Swap to a semver
          # tag if we want prod pinning.
          image: cbioportal/mcp:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          env:
            # Node-local Datadog agent IP exposed via Downward API.
            - name: DD_AGENT_HOST
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
            - name: OTEL_SERVICE_NAME
              value: "cbioportal-mcp-auth"
            - name: DD_LLMOBS_ML_APP
              value: "cbioportal-mcp-auth"
            - name: DD_SITE
              value: "datadoghq.com"
            # Mount FastMCP at /db/mcp so this Deployment IS the public
            # /db/mcp endpoint on mcp.cbioportal.org — public MCP is
            # OAuth-gated by default. LibreChat continues to reach the
            # header-trust `cbioagent-clickhouse-mcp` Deployment via the
            # in-cluster ClusterIP Service (never touches the public
            # ingress), so it's unaffected. Paired with NOT stripping
            # /db on the mcp-cbioportal-db-ingress Ingress.
            - name: CLICKHOUSE_MCP_HTTP_PATH
              value: "/db/mcp"
            # Trust X-Forwarded-* from any in-cluster source so uvicorn's
            # 307 trailing-slash redirect honors Traefik's
            # X-Forwarded-Proto: https. Same reasoning as the sibling
            # unauthenticated MCP Deployments.
            - name: CLICKHOUSE_MCP_FORWARDED_ALLOW_IPS
              value: "*"
            # Reused from the cBioPortal webapp's own Spring session Redis
            # (cbioportal-public-blue), not a dedicated instance.
            - name: REDIS_SESSION_HOST
              valueFrom:
                secretKeyRef:
                  name: cbioportal-public-blue
                  key: REDIS_SESSION_HOST
            - name: REDIS_SESSION_PORT
              valueFrom:
                secretKeyRef:
                  name: cbioportal-public-blue
                  key: REDIS_SESSION_PORT
            - name: REDIS_SESSION_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: cbioportal-public-blue
                  key: REDIS_SESSION_PASSWORD
            # cbioportal-mcp's own OAuth client/token storage (see
            # cbioportal-mcp#131) — without this, OAuth state lives on the
            # pod's ephemeral disk and every restart invalidates every
            # session. Database 1: database 0 on this instance is Spring's
            # own session store, 1-15 are unclaimed. Deliberately not the
            # persistence-cache Redis (cbioportal-public-persistence-redis-master)
            # — that one sets --redis.clear_on_startup=true, which would
            # reproduce this exact bug.
            - name: REDIS_URL
              value: "redis://:$(REDIS_SESSION_PASSWORD)@$(REDIS_SESSION_HOST):$(REDIS_SESSION_PORT)/1"
          envFrom:
            - secretRef:
                name: clickhouse-mcp
            # Google OAuth client — the presence of all three
            # CBIOPORTAL_MCP_GOOGLE_* env vars flips the server into
            # authenticated mode (see cbioportal-mcp auth.py). Lives in
            # portal-configuration since it holds secrets.
            - secretRef:
                name: cbioportal-mcp-google-oauth
            # ConfigMap mounted AFTER the Secrets so its CLICKHOUSE_DATABASE
            # value wins (envFrom: last-writer-wins on key collisions). The
            # cbioagent-clickhouse-clone-daily CronJob owns this ConfigMap
            # and updates it when the production color flips, then rolls
            # this Deployment.
            - configMapRef:
                name: clickhouse-mcp-active
      nodeSelector:
        workload: "cbioagent"
      tolerations:
        - key: "workload"
          operator: "Equal"
          value: "cbioagent"
          effect: "NoSchedule"
---
apiVersion: v1
kind: Service
metadata:
  name: cbioagent-clickhouse-mcp-auth
spec:
  selector:
    run: cbioagent-clickhouse-mcp-auth
  ports:
    - port: 80
      name: http
      targetPort: 8000
  type: ClusterIP
