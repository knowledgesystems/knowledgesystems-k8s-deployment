replicaCount: 1
global:
  librechat:
    existingSecretName: "librechat-credentials-env"
    existingSecretApiKey: OPENAI_API_KEY
    # Direct `env:` entries override same-key entries from the
    # librechat-credentials-env Secret (shared with beta). Haiku 4.5 backs
    # the default modelSpec; `us.` prefix is required by data-residency policy.
    env:
      - name: BEDROCK_AWS_MODELS
        value: "us.anthropic.claude-sonnet-4-5-20250929-v1:0,us.anthropic.claude-sonnet-4-6,us.anthropic.claude-sonnet-5,us.anthropic.claude-haiku-4-5-20251001-v1:0"

deploymentAnnotations:
  secret.reloader.stakater.com/reload: "k8s-aws-creds-manager,librechat-credentials-env"
  configmap.reloader.stakater.com/reload: "librechat-config"

librechat:
  existingSecretName: "librechat-credentials-env"
  existingConfigYaml: "librechat-config"
  configEnv:
    PRODUCT_FEEDBACK_ENABLED: "true"
    AWS_PROFILE: "490004633549"
    # Public URLs. Must live in the ConfigMap, not the shared
    # librechat-credentials-env Secret, because the Secret is mounted after
    # the ConfigMap in envFrom and would otherwise override beta's ConfigMap
    # values (beta.chat.cbioportal.org) with these prod URLs.
    DOMAIN_CLIENT: "https://chat.cbioportal.org"
    DOMAIN_SERVER: "https://chat.cbioportal.org"
    NODE_OPTIONS: "--require dd-trace/init"
    DD_ENV: "public"
    DD_VERSION: "v0.8.3"
    DD_LLMOBS_ENABLED: "1"
    DD_LLMOBS_ML_APP: "cbioagent"
    DD_LLMOBS_AGENTLESS_ENABLED: "true"
    DD_SITE: "datadoghq.com"
    DD_TRACE_PROPAGATION_STYLE: "tracecontext,datadog"
  imageVolume:
    accessModes: ReadWriteMany
    storageClassName: efs-sc

image:
  repository: cbioportal/librechat
  registry: docker.io
  pullPolicy: Always
  # Overrides the image tag whose default is the chart appVersion.
  # v0.8.7-custom-v1: rebase of our v0.8.3-rc1-custom-v9 customizations
  # onto upstream v0.8.7. Brings agents-lib 3.2.46 with Bedrock
  # cachePoint wiring (unlocks Bedrock prompt caching — see
  # model_parameters.promptCache: true on the prod agent records) +
  # ~860 upstream commits worth of fixes. Beta soaked 2026-08-07.
  # v0.8.7-custom-v2: per-modelSpec model for one agent (Haiku 4.5 default /
  # Sonnet 5 picker in the chat input) and per-response stats popover.
  tag: "v0.8.7-custom-v2"

mongodb:
  enabled: false

librechat-rag-api:
  enabled: true
  postgresql:
    enabled: true

podLabels:
  tags.datadoghq.com/env: "public"
  tags.datadoghq.com/service: "librechat"
  tags.datadoghq.com/version: "v0.8.3"

nodeSelector:
  workload: cbioagent

tolerations:
  - key: "workload"
    operator: "Equal"
    value: "cbioagent"
    effect: "NoSchedule"

ingress:
  enabled: false

resources:
  requests:
    memory: 2Gi
  limits:
    memory: 4Gi

readinessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 10
  timeoutSeconds: 1
  periodSeconds: 5
  failureThreshold: 3
livenessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 20
  timeoutSeconds: 1
  periodSeconds: 12
  failureThreshold: 5

volumes:
  - name: aws-creds
    secret:
      secretName: k8s-aws-creds-manager
volumeMounts:
  - name: aws-creds
    mountPath: /home/node/.aws
    readOnly: true
