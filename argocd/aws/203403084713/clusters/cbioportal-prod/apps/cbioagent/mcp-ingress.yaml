apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: strip-navigator-prefix
  namespace: default
spec:
  stripPrefix:
    prefixes:
      - /navigator
---
# 302 to the MCP setup docs. Applied to:
#   - the bare-hostname root landing (mcp-cbioportal-root-redirect-ingress)
#   - browser GETs to /db/mcp and /db-mcp-apps/mcp (via the
#     mcp-cbioportal-browser-redirect-route IngressRoute below)
# so a human who lands on the endpoint URL sees setup instructions
# instead of a raw 401 JSON body. Non-permanent (302) so we can move
# the docs URL later without stale-cache pain.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: redirect-to-mcp-docs
  namespace: default
spec:
  redirectRegex:
    regex: ^.*$
    replacement: https://docs.cbioportal.org/ai-integrations/mcp/
    permanent: false
---
# Rate-limit the public database MCP path. Unlike /navigator (which only
# mints URLs), /db lets clients run arbitrary SELECTs against ClickHouse —
# cap per-IP throughput so a single client (or scraper) can't DOS the
# backend. average=2/sec sustained, burst=20 covers a normal chat session
# firing a handful of tool calls in quick succession.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: ratelimit-db
  namespace: default
spec:
  rateLimit:
    average: 2
    period: 1s
    burst: 20
    sourceCriterion:
      ipStrategy:
        depth: 1
---
# /navigator — unchanged from the original single-path setup, kept as its
# own Ingress so its middleware annotation only applies to itself.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mcp-cbioportal-ingress
  annotations:
    acme.cert-manager.io/http01-ingress-class: traefik
    cert-manager.io/cluster-issuer: letsencrypt-prod
    kubernetes.io/ingress.class: traefik
    kubernetes.io/tls-acme: "true"
    traefik.ingress.kubernetes.io/router.middlewares: default-strip-navigator-prefix@kubernetescrd
  labels:
    app.kubernetes.io/instance: cbioagent
spec:
  rules:
    - host: mcp.cbioportal.org
      http:
        paths:
          - path: /navigator
            pathType: Prefix
            backend:
              service:
                name: cbioportal-navigator
                port:
                  number: 80
  tls:
    - hosts:
        - mcp.cbioportal.org
      secretName: mcp-cbio-cert
---
# /db — the public MCP entry point on mcp.cbioportal.org, now
# Google-OAuth-gated by pointing at cbioagent-clickhouse-mcp-auth
# (was cbioagent-clickhouse-mcp). LibreChat is unaffected: it dials
# the unauthenticated `cbioagent-clickhouse-mcp` Deployment directly
# over the in-cluster ClusterIP Service and never touches this Ingress.
#
# The /db path is NOT stripped — FastMCP is configured (via the
# CLICKHOUSE_MCP_HTTP_PATH env var on cbioagent-clickhouse-mcp-auth)
# to mount itself at /db/mcp so trailing-slash redirects and internal
# routing build correct URLs.
#
# Also carries the root-level OAuth-plane routes that FastMCP's
# GoogleProvider registers at the base_url ORIGIN (not under the MCP
# mount path). Enumerated against a probe FastMCP+GoogleProvider
# instance:
#   /.well-known/oauth-authorization-server (AS metadata)
#   /.well-known/oauth-protected-resource/... (resource metadata; suffix depends on mount path)
#   /authorize     (auth code request)
#   /token         (token exchange)
#   /register      (Dynamic Client Registration for MCP clients)
#   /consent       (host consent screen)
#   /auth/callback (Google -> us callback; MUST match the URI
#                  registered in Google Cloud Console for this client)
# These paths are otherwise unused on mcp.cbioportal.org — no other
# service on this host consumes them today.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mcp-cbioportal-db-ingress
  annotations:
    kubernetes.io/ingress.class: traefik
    traefik.ingress.kubernetes.io/router.middlewares: default-ratelimit-db@kubernetescrd
  labels:
    app.kubernetes.io/instance: cbioagent
spec:
  rules:
    - host: mcp.cbioportal.org
      http:
        paths:
          - path: /db
            pathType: Prefix
            backend:
              service:
                name: cbioagent-clickhouse-mcp-auth
                port:
                  number: 80
          - path: /.well-known/oauth-authorization-server
            pathType: Prefix
            backend:
              service:
                name: cbioagent-clickhouse-mcp-auth
                port:
                  number: 80
          - path: /.well-known/oauth-protected-resource
            pathType: Prefix
            backend:
              service:
                name: cbioagent-clickhouse-mcp-auth
                port:
                  number: 80
          - path: /authorize
            pathType: Prefix
            backend:
              service:
                name: cbioagent-clickhouse-mcp-auth
                port:
                  number: 80
          - path: /token
            pathType: Prefix
            backend:
              service:
                name: cbioagent-clickhouse-mcp-auth
                port:
                  number: 80
          - path: /register
            pathType: Prefix
            backend:
              service:
                name: cbioagent-clickhouse-mcp-auth
                port:
                  number: 80
          - path: /consent
            pathType: Prefix
            backend:
              service:
                name: cbioagent-clickhouse-mcp-auth
                port:
                  number: 80
          - path: /auth/callback
            pathType: Prefix
            backend:
              service:
                name: cbioagent-clickhouse-mcp-auth
                port:
                  number: 80
  tls:
    - hosts:
        - mcp.cbioportal.org
      secretName: mcp-cbio-cert
---
# /db-mcp-apps — separate Ingress so its own rate-limit middleware only applies
# here. Same host + same TLS secret; Traefik merges Ingress rules per
# host. The path is NOT stripped — FastMCP is configured (via the
# CLICKHOUSE_MCP_HTTP_PATH env var on cbioagent-clickhouse-mcp) to mount
# itself at /db/mcp so trailing-slash redirects build correct URLs.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mcp-cbioportal-db-mcp-apps-ingress
  annotations:
    kubernetes.io/ingress.class: traefik
    traefik.ingress.kubernetes.io/router.middlewares: default-ratelimit-db@kubernetescrd
  labels:
    app.kubernetes.io/instance: cbioagent
spec:
  rules:
    - host: mcp.cbioportal.org
      http:
        paths:
          - path: /db-mcp-apps
            pathType: Prefix
            backend:
              service:
                name: cbioagent-clickhouse-mcp-apps
                port:
                  number: 80
  tls:
    - hosts:
        - mcp.cbioportal.org
      secretName: mcp-cbio-cert
---
# / on mcp.cbioportal.org — bare-hostname visits get 302'd to the MCP
# setup docs instead of the current hard 404. `pathType: Exact` scopes
# this to just `/`; the /db, /db-mcp-apps, /navigator, and OAuth-plane
# paths remain served by their own Ingresses above. Backend is a
# placeholder — the redirect middleware short-circuits the request.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mcp-cbioportal-root-redirect-ingress
  annotations:
    kubernetes.io/ingress.class: traefik
    traefik.ingress.kubernetes.io/router.middlewares: default-redirect-to-mcp-docs@kubernetescrd
  labels:
    app.kubernetes.io/instance: cbioagent
spec:
  rules:
    - host: mcp.cbioportal.org
      http:
        paths:
          - path: /
            pathType: Exact
            backend:
              service:
                name: cbioagent-clickhouse-mcp-auth
                port:
                  number: 80
  tls:
    - hosts:
        - mcp.cbioportal.org
      secretName: mcp-cbio-cert
---
# Browser GETs to /db/mcp and /db-mcp-apps/mcp → 302 to docs. Uses a
# Traefik IngressRoute (not a plain Ingress) because we need to match
# on Method + User-Agent regex simultaneously, which the standard
# Ingress spec doesn't express. Higher `priority` than any standard
# Ingress rule so this route wins for matching requests.
#
# Detection: `HeaderRegexp("User-Agent", "Mozilla")` catches every
# real browser (Chrome, Firefox, Safari, Edge — they all send
# "Mozilla/5.0 (...)"). MCP clients don't: Anthropic/ClaudeAI,
# Anthropic/Toolbox, github-copilot-developer, python-httpx, curl,
# WhatsApp scraper, etc. all send non-Mozilla UAs and pass through
# to the normal MCP path. `!HeaderRegexp("User-Agent", "(?i)(headless|kprofile-pipeline)")`
# mirrors the sibling cbioportal-www-ingressroute pattern, excluding
# our own headless testing traffic.
#
# GET-only: MCP Streamable HTTP uses GET for the SSE upgrade
# (`Accept: text/event-stream`) — but MCP clients still send
# non-Mozilla UAs there, so the UA check is sufficient to avoid
# breaking SSE. POSTs (MCP RPC) are never intercepted.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: mcp-cbioportal-browser-redirect-route
  namespace: default
  labels:
    app.kubernetes.io/instance: cbioagent
spec:
  entryPoints:
    - websecure
  routes:
    - match: >-
        Host(`mcp.cbioportal.org`) && PathPrefix(`/db/mcp`) && Method(`GET`) &&
        HeaderRegexp(`User-Agent`, `Mozilla`) &&
        !HeaderRegexp(`User-Agent`, `(?i)(headless|kprofile-pipeline)`)
      kind: Rule
      priority: 100
      middlewares:
        - name: redirect-to-mcp-docs
          namespace: default
      services:
        - name: cbioagent-clickhouse-mcp-auth
          port: 80
    - match: >-
        Host(`mcp.cbioportal.org`) && PathPrefix(`/db-mcp-apps/mcp`) && Method(`GET`) &&
        HeaderRegexp(`User-Agent`, `Mozilla`) &&
        !HeaderRegexp(`User-Agent`, `(?i)(headless|kprofile-pipeline)`)
      kind: Rule
      priority: 100
      middlewares:
        - name: redirect-to-mcp-docs
          namespace: default
      services:
        - name: cbioagent-clickhouse-mcp-apps
          port: 80
  tls:
    secretName: mcp-cbio-cert
