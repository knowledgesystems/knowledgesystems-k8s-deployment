# Builds the VEP 111 GRCh38 offline cache onto gn-vep-111-grch38-cache-efs, then
# self-tests it. Delete the Job to re-run; it resumes rather than restarting.
apiVersion: batch/v1
kind: Job
metadata:
  name: gn-vep-111-grch38-cache-loader
  namespace: genome-nexus
  labels:
    run: gn-vep-111-grch38-cache-loader
spec:
  # cbio-dev is SPOT and rotates every 1-3h. Every step below is resumable, so
  # an eviction costs seconds -- but the Job needs enough retries to absorb them.
  backoffLimit: 20
  template:
    metadata:
      labels:
        run: gn-vep-111-grch38-cache-loader
    spec:
      restartPolicy: Never
      containers:
        - name: loader
          # Same image as gn-vep-111-grch38, so the cache is built by the VEP
          # version that will read it.
          image: genomenexus/gn-vep:111-grch38-3.1.1-extended
          imagePullPolicy: IfNotPresent
          command: ["bash", "-c"]
          args:
            - |
              set -euo pipefail
              CD=/cache-data
              DEST=$CD/homo_sapiens/111_GRCh38
              CACHE_URL=https://ftp.ensembl.org/pub/release-111/variation/indexed_vep_cache
              FASTA_URL=https://ftp.ensembl.org/pub/release-111/fasta/homo_sapiens/dna_index
              TAR=homo_sapiens_vep_111_GRCh38.tar.gz
              TARSZ=27090944656
              FA=Homo_sapiens.GRCh38.dna.toplevel.fa.gz

              echo "node=${NODE_NAME:-?}"
              # EFS access points substitute their own POSIX uid/gid for the
              # client's, so this should succeed despite the image running as 999.
              mkdir -p "$CD/tmp" && touch "$CD/.probe" && rm -f "$CD/.probe"
              echo "write probe OK as $(id -u):$(id -g)"
              df -h "$CD" | tail -1

              # --- resumable download. Ensembl serves Accept-Ranges: bytes, so
              # -C - picks up from whatever is already on disk after an eviction.
              if [ ! -f "$CD/.cache_extracted" ]; then
                for i in $(seq 1 200); do
                  HAVE=$( [ -f "$CD/tmp/$TAR" ] && stat -c %s "$CD/tmp/$TAR" || echo 0 )
                  [ "$HAVE" -ge "$TARSZ" ] && break
                  echo "download attempt $i: have $HAVE of $TARSZ"
                  curl -fL --retry 5 --retry-delay 10 --retry-all-errors \
                       -C - -o "$CD/tmp/$TAR" "$CACHE_URL/$TAR" || true
                  NEW=$( [ -f "$CD/tmp/$TAR" ] && stat -c %s "$CD/tmp/$TAR" || echo 0 )
                  [ "$NEW" -ge "$TARSZ" ] && break
                  [ "$NEW" -le "$HAVE" ] && sleep 30
                done
                HAVE=$(stat -c %s "$CD/tmp/$TAR")
                [ "$HAVE" -eq "$TARSZ" ] || { echo "FAIL: got $HAVE of $TARSZ bytes"; exit 1; }

                # Ensembl's CHECKSUMS is `sum` format: "<checksum> <blocks> <name>"
                curl -fsL -o "$CD/tmp/CHECKSUMS" "$CACHE_URL/CHECKSUMS"
                WANT=$(grep " $TAR\$" "$CD/tmp/CHECKSUMS" | awk '{print $1, $2}')
                GOT=$(sum "$CD/tmp/$TAR" | awk '{print $1, $2}')
                echo "checksum want=[$WANT] got=[$GOT]"
                [ "$WANT" = "$GOT" ] || { echo "FAIL: checksum mismatch"; exit 1; }

                echo "extracting"
                mkdir -p "$CD"
                tar -C "$CD" -xzf "$CD/tmp/$TAR"
                test -d "$DEST" || { echo "FAIL: $DEST not created by tar"; exit 1; }
                rm -f "$CD/tmp/$TAR"
                touch "$CD/.cache_extracted"
              else
                echo "cache already extracted, skipping"
              fi

              # --- FASTA: Ensembl's dna_index/ already ships it bgzip-compressed
              # with .fai and .gzi, so there is nothing to convert or index.
              for f in "$FA" "$FA.fai" "$FA.gzi"; do
                if [ ! -s "$DEST/$f" ]; then
                  echo "fetching $f"
                  curl -fL --retry 5 --retry-delay 10 --retry-all-errors \
                       -C - -o "$DEST/$f" "$FASTA_URL/$f"
                fi
              done
              test -s "$DEST/$FA.gzi" || { echo "FAIL: FASTA index missing"; exit 1; }

              du -sh "$CD"/* 2>/dev/null || true
              ls "$DEST"/*/all_vars.gz >/dev/null 2>&1 \
                && echo "indexed cache OK (variation data present)" \
                || echo "WARN: no all_vars.gz -- colocated_variants will be empty"

              # --- self-test: a single N placeholder standing in for a 3-base
              # reference, which is what the backfill converter emits for every
              # deletion. True ref at 17:7676000-7676002 is AGT. No --format:
              # VEP auto-detects Ensembl default; --format=ensembl breaks.
              cd /opt/vep/src/ensembl-vep
              OUT=$(./vep --cache --dir_cache="$CD" --offline \
                --fasta="$DEST/$FA" --lookup_ref \
                --json --no_stats --everything --hgvsg \
                --output_file=STDOUT --warning_file=STDERR \
                --input_data="17 7676000 7676002 N/- + 17:g.7676000_7676002del") || true
              echo "$OUT" | head -c 300; echo
              echo "$OUT" | grep -q '"allele_string":"AGT/-"' \
                || { echo "FAIL: expected allele_string AGT/-; converter cannot rely on --lookup_ref for multi-base deletions"; exit 1; }
              echo "PASS: N placeholder resolved to AGT/- over a 3-base range"
              echo "$OUT" | grep -q '"id":"17:g.7676000_7676002del"' \
                && echo "PASS: identifier round-tripped into id" \
                || echo "WARN: id did not echo the 6th-field identifier"
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          resources:
            requests:
              memory: 2Gi
              cpu: "500m"
            limits:
              memory: 8Gi
          volumeMounts:
            - name: cache
              mountPath: /cache-data
      volumes:
        - name: cache
          persistentVolumeClaim:
            claimName: gn-vep-111-grch38-cache-efs
      # No zone pin: EFS is multi-AZ, unlike the EBS volume this replaces.
      # Not gn-db-lg -- those nodes run the production mongos.
      nodeSelector:
        workload: "cbio-dev"
      tolerations:
        - key: "workload"
          operator: "Equal"
          value: "cbio-dev"
          effect: "NoSchedule"
