# Builds the VEP 111 GRCh38 offline cache onto gn-vep-111-grch38-backfill-pvc,
# then self-tests it. One-shot; delete the Job to re-run it.
apiVersion: batch/v1
kind: Job
metadata:
  name: gn-vep-111-grch38-cache-loader
  namespace: genome-nexus
  labels:
    run: gn-vep-111-grch38-cache-loader
spec:
  backoffLimit: 2
  template:
    metadata:
      labels:
        run: gn-vep-111-grch38-cache-loader
    spec:
      restartPolicy: Never
      # The image creates /cache-data as root then drops to USER vep (999), so
      # without this a freshly provisioned PVC mounted there is not writable.
      securityContext:
        fsGroup: 999
      containers:
        - name: loader
          # Same image as gn-vep-111-grch38, so the cache is built by the VEP
          # version that will read it.
          image: genomenexus/gn-vep:111-grch38-3.1.1-extended
          imagePullPolicy: IfNotPresent
          command: ["bash", "-c"]
          args:
            - |
              set -euo pipefail
              echo "node=${NODE_NAME:-?} expected-zone=${EXPECTED_ZONE:-?}"
              df -h /cache-data | tail -1

              if [ -f /cache-data/.cache_complete ]; then
                echo "cache already present, skipping download"
              else
                # -a cf also bgzips the FASTA; Ensembl ships plain gzip, which
                # --fasta rejects. -n leaves the bundled API alone, -l skips
                # htslib (already in the image).
                cd /opt/vep/src/ensembl-vep
                perl INSTALL.pl -a cf -s homo_sapiens -y GRCh38 \
                  -c /cache-data --CACHE_VERSION 111 -n -l
                touch /cache-data/.cache_complete
              fi

              CACHE_DIR=/cache-data/homo_sapiens/111_GRCh38
              test -d "$CACHE_DIR" || { echo "FAIL: $CACHE_DIR missing"; exit 1; }
              FASTA=$(ls "$CACHE_DIR"/*.fa.gz 2>/dev/null | head -1)
              test -n "$FASTA" || { echo "FAIL: no bgzip FASTA"; exit 1; }
              du -sh /cache-data/* 2>/dev/null || true

              # colocated_variants needs the indexed cache, not the minimal one.
              ls "$CACHE_DIR"/*/all_vars.gz >/dev/null 2>&1 \
                && echo "indexed cache OK" \
                || echo "WARN: no all_vars.gz -- colocated_variants will be empty"

              # Self-test. Asserts --lookup_ref resolves a single N placeholder
              # across a 3-base range, which is what the backfill converter
              # emits for every deletion. True ref at 17:7676000-7676002 is AGT.
              # No --format: VEP auto-detects Ensembl default; --format=ensembl
              # is the form VEPService warns breaks.
              cd /opt/vep/src/ensembl-vep
              OUT=$(./vep --cache --dir_cache=/cache-data --offline \
                --fasta="$FASTA" --lookup_ref \
                --json --no_stats --everything --hgvsg \
                --output_file=STDOUT --warning_file=STDERR \
                --input_data="17 7676000 7676002 N/- + 17:g.7676000_7676002del") || true
              echo "$OUT" | head -c 300; echo

              echo "$OUT" | grep -q '"allele_string":"AGT/-"' \
                || { echo "FAIL: expected allele_string AGT/-; converter cannot rely on --lookup_ref for multi-base deletions"; exit 1; }
              echo "PASS: N placeholder resolved to AGT/- over a 3-base range"
              echo "$OUT" | grep -q '"id":"17:g.7676000_7676002del"' \
                && echo "PASS: identifier round-tripped into id" \
                || echo "WARN: id did not echo the 6th-field identifier"
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: EXPECTED_ZONE
              value: "us-east-1d"
          resources:
            requests:
              memory: 2Gi
              cpu: "500m"
            limits:
              memory: 8Gi
          volumeMounts:
            - name: cache
              mountPath: /cache-data
      volumes:
        - name: cache
          persistentVolumeClaim:
            claimName: gn-vep-111-grch38-backfill-pvc
      # Not gn-db-lg: those nodes run the production mongos. The zone pin fixes
      # where the WaitForFirstConsumer PVC is created; later consumers must match.
      nodeSelector:
        workload: "cbio-dev"
        topology.kubernetes.io/zone: "us-east-1d"
      tolerations:
        - key: "workload"
          operator: "Equal"
          value: "cbio-dev"
          effect: "NoSchedule"
