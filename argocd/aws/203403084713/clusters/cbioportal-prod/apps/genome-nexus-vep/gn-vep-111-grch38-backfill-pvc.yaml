# Scratch space for the Ensembl 111 GRCh38 vep.annotation backfill: VEP cache
# (~26G), FASTA (~1G), HGVSg key shards (~9G). Deleted once the backfill is done.
#
# ReadWriteOnce: EBS attaches to one node at a time, so every consumer must run
# on the same node and in the same AZ as the volume.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: gn-vep-111-grch38-backfill-pvc
  namespace: genome-nexus
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 60Gi
