apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cbioagent
  annotations:
    # Workaround for Argo CD v2.14.2 on EKS/Kubernetes 1.35. With the app-wide
    # ServerSideApply=true sync option below, Argo's default diff is the
    # structured-merge diff, which types live objects against Argo's embedded
    # static schema (k8s.io/api v0.31). That schema has no
    # `.status.terminatingReplicas` (added in k8s 1.33), so every comparison
    # has failed since the 1.35 upgrade with:
    #   ComparisonError: ... .status.terminatingReplicas: field not declared in schema
    # Server-Side Diff does a server-side dry-run apply against the cluster's
    # own schema instead, so the field resolves. The ignoreDifferences below
    # still applies: the jsonPointers normalizer strips
    # /data/CLICKHOUSE_DATABASE from the desired manifest before the dry-run
    # and from both sides before comparing.
    # Remove this annotation once Argo CD is upgraded to >= v3.1, which ships
    # a newer static schema.
    # Refs:
    #   https://argo-cd.readthedocs.io/en/release-2.14/user-guide/diff-strategies/#server-side-diff
    #   https://argo-cd.readthedocs.io/en/stable/faq/#how-do-i-fix-field-not-declared-in-schema
    argocd.argoproj.io/compare-options: ServerSideDiff=true
spec:
  project: default
  sources:
    - repoURL: https://github.com/knowledgesystems/knowledgesystems-k8s-deployment
      path: argocd/aws/203403084713/clusters/cbioportal-prod/apps/cbioagent
      targetRevision: HEAD
      directory:
        recurse: true
      ref: k8s-repo
    - chart: librechat
      repoURL: ghcr.io/danny-avila/librechat-chart
      targetRevision: 1.9.8
      helm:
        releaseName: cbioagent
        valueFiles:
          - $k8s-repo/argocd/aws/203403084713/clusters/cbioportal-prod/apps/cbioagent/values.yaml
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    # RespectIgnoreDifferences + ServerSideApply together let the cron's
    # in-cluster patch on `clickhouse-mcp-active.data.CLICKHOUSE_DATABASE`
    # survive each sync. RespectIgnoreDifferences alone wasn't enough:
    # with the default client-side apply, Argo sends the whole resource
    # and the API server's three-way merge clobbers the ignored field
    # back to git. ServerSideApply lets Argo build the patch from
    # managed-fields and omit the ignored JSON pointer entirely.
    # Refs:
    #   https://argo-cd.readthedocs.io/en/stable/user-guide/sync-options/#respect-ignore-difference-configs
    #   https://argo-cd.readthedocs.io/en/stable/user-guide/sync-options/#server-side-apply
    syncOptions:
      - RespectIgnoreDifferences=true
      - ServerSideApply=true
  destination:
    namespace: default
    server: https://kubernetes.default.svc
  # The cron job cbioagent-clickhouse-clone-daily owns the live value of
  # data.CLICKHOUSE_DATABASE in this ConfigMap — it patches the field on
  # every successful clone+flip. Combined with the RespectIgnoreDifferences
  # sync option above, Argo leaves the cron's patch alone instead of
  # reverting it to the seed value in cbioagent-clickhouse-clone-daily.yaml.
  ignoreDifferences:
    - group: ""
      kind: ConfigMap
      name: clickhouse-mcp-active
      namespace: default
      jsonPointers:
        - /data/CLICKHOUSE_DATABASE
