apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cbioportal-v7
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/knowledgesystems/knowledgesystems-k8s-deployment
    targetRevision: master
    path: argocd/aws/203403084713/clusters/cbioportal-prod/apps/cbioportal-v7
    directory:
      recurse: true
  destination:
    namespace: default
    server: https://kubernetes.default.svc
  ignoreDifferences:
  - group: networking.k8s.io
    kind: Ingress
    name: public-v7-ingress
    namespace: default
    jsonPointers:
    - /spec/rules/0/http/paths/0/backend/service/name
  - group: apps
    kind: Deployment
    name: cbioportal-backend-public-v7-blue
    namespace: default
    jsonPointers:
    - /spec/template/metadata/annotations/kubectl.kubernetes.io~1restartedAt
  - group: apps
    kind: Deployment
    name: cbioportal-backend-public-v7-green
    namespace: default
    jsonPointers:
    - /spec/template/metadata/annotations/kubectl.kubernetes.io~1restartedAt
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - RespectIgnoreDifferences=true
