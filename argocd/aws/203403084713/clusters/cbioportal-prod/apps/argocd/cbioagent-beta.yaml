apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cbioagent-beta
spec:
  project: default
  sources:
    - repoURL: https://github.com/knowledgesystems/knowledgesystems-k8s-deployment
      path: argocd/aws/203403084713/clusters/cbioportal-prod/apps/cbioagent-beta
      targetRevision: HEAD
      directory:
        recurse: true
      ref: k8s-repo
    - path: helm/librechat
      repoURL: https://github.com/danny-avila/LibreChat.git
      targetRevision: v0.8.3-rc1
      helm:
        releaseName: cbioagent-beta
        valueFiles:
          - $k8s-repo/argocd/aws/203403084713/clusters/cbioportal-prod/apps/cbioagent-beta/values.yaml
  # Manual sync only. RespectIgnoreDifferences keeps the beta clone cron's
  # patch on clickhouse-mcp-active-beta across a sync; that ConfigMap opts
  # into ServerSideApply with its own sync-options annotation, so the rest
  # of the app keeps client-side apply.
  syncPolicy:
    syncOptions:
      - RespectIgnoreDifferences=true
  destination:
    namespace: default
    server: https://kubernetes.default.svc
  # cbioagent-clickhouse-clone-daily-beta owns the live value of
  # data.CLICKHOUSE_DATABASE. `group` is omitted (defaults to the core API
  # group): an explicit `group: ""` is stripped on apply and the matcher
  # doesn't fire.
  ignoreDifferences:
    - kind: ConfigMap
      name: clickhouse-mcp-active-beta
      namespace: default
      jsonPointers:
        - /data/CLICKHOUSE_DATABASE
