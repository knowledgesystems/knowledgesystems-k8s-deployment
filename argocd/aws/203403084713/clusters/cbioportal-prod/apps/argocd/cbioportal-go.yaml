apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cbioportal-go
  namespace: argocd
  annotations:
    # Workaround for Argo CD v2.14.2 on Kubernetes 1.35, as in cbioagent.yaml:
    # with ServerSideApply=true the default structured-merge diff types live
    # objects against Argo's embedded schema (k8s.io/api v0.31), which has no
    # Deployment `.status.terminatingReplicas`, so every comparison fails with
    #   ComparisonError: ... .status.terminatingReplicas: field not declared in schema
    # Server-Side Diff dry-runs the apply against the cluster's own schema.
    # Remove once Argo CD is >= v3.1.
    # Refs:
    #   https://argo-cd.readthedocs.io/en/release-2.14/user-guide/diff-strategies/#server-side-diff
    #   https://argo-cd.readthedocs.io/en/stable/faq/#how-do-i-fix-field-not-declared-in-schema
    argocd.argoproj.io/compare-options: ServerSideDiff=true
spec:
  project: default
  source:
    repoURL: https://github.com/knowledgesystems/knowledgesystems-k8s-deployment
    path: argocd/aws/203403084713/clusters/cbioportal-prod/apps/cbioportal-go
    targetRevision: HEAD
    directory:
      recurse: true
  destination:
    namespace: default
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    # ServerSideApply builds the patch from managed-fields, so with
    # RespectIgnoreDifferences the ignored pointer data is left out of the
    # apply instead of being reset to the seed.
    syncOptions:
      - RespectIgnoreDifferences=true
      - ServerSideApply=true
  # The live pointer values are set by kubectl patch (and later the mirror job).
  ignoreDifferences:
    - group: ""
      kind: ConfigMap
      name: cbioportal-go-active
      namespace: default
      jsonPointers:
        - /data/CBIOPORTAL_DB
        - /data/CBIOPORTAL_RAW_DB
        - /data/CBIOPORTAL_REF_DB
  revisionHistoryLimit: 3
