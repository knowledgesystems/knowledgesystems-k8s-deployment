# One datahub-import-<N> Application per open cBioPortal/datahub pull
# request labelled `preview`: datahub-pr-<N>.gopreview.cbioportal.org and
# its import Job, rendered from apps/cbioportal-hub/import-job-helm.
# Removing the label or closing the PR deletes the Application, its
# resources and (PostDelete hook) its databases.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: datahub-pr-import-set
  namespace: argocd
spec:
  generators:
    - pullRequest:
        github:
          owner: cBioPortal
          repo: datahub
          labels:
            - preview
        requeueAfterSeconds: 120
  template:
    metadata:
      name: 'datahub-import-{{number}}'
      finalizers:
        - resources-finalizer.argocd.argoproj.io
    spec:
      destination:
        namespace: default
        server: 'https://kubernetes.default.svc'
      project: default
      source:
        repoURL: https://github.com/knowledgesystems/knowledgesystems-k8s-deployment
        path: argocd/aws/203403084713/clusters/cbioportal-prod/apps/cbioportal-hub/import-job-helm
        targetRevision: HEAD
        helm:
          parameters:
            - name: prNumber
              value: '{{number}}'
            - name: prBranch
              value: '{{branch}}'
            - name: headSha
              value: '{{head_sha}}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - RespectIgnoreDifferences=true
