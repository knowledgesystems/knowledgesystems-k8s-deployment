# Not mounted by any pod; holds the retired SQLite catalog. Kept in git so ArgoCD doesn't
# list it for pruning: the reclaim policy is Delete, so pruning deletes the EBS volume.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: cell-explorer-data
  namespace: cell-explorer
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: ebs-sc
  resources:
    requests:
      storage: 10Gi
