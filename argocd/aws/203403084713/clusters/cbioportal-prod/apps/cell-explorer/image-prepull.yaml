# Keeps the app image cached on every cell-explorer node so a spot failover
# doesn't wait ~2.5min for a GHCR pull: an idle container from the same image
# runs on each node, and kubelet won't garbage-collect an image in use.
# Keep the image identical to deployment.yaml — bump both together.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: cell-explorer-image-prepull
  namespace: cell-explorer
  labels:
    app: cell-explorer-image-prepull
spec:
  selector:
    matchLabels:
      app: cell-explorer-image-prepull
  template:
    metadata:
      labels:
        app: cell-explorer-image-prepull
    spec:
      nodeSelector:
        workload: cell-explorer
      tolerations:
        - key: "workload"
          operator: "Equal"
          value: "cell-explorer"
          effect: "NoSchedule"
      automountServiceAccountToken: false
      # sleep ignores SIGTERM as PID 1; don't wait the default 30s on delete.
      terminationGracePeriodSeconds: 1
      containers:
        - name: hold
          image: ghcr.io/cbioportal/cell-explorer-py:sha-03614ed@sha256:6cc85f3639c190b9df741e5efb29b6452f1d95e946d85abf9548efe637dbda12
          imagePullPolicy: IfNotPresent
          # Override the app CMD (migrations + uvicorn): never touch the SQLite volume.
          command: ["sleep", "infinity"]
          resources:
            requests:
              cpu: 1m
              memory: 8Mi
            limits:
              cpu: 10m
              memory: 16Mi
