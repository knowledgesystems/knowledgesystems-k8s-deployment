apiVersion: apps/v1
kind: Deployment
metadata:
  name: cell-explorer
  namespace: cell-explorer
  labels:
    app: cell-explorer
  annotations:
    # Restart when the aws creds (refreshed on a schedule) or app secrets change.
    secret.reloader.stakater.com/reload: "k8s-aws-creds-manager,cell-explorer-secrets"
    # Config is injected with envFrom, which Kubernetes reads only at container
    # start — a ConfigMap edit alone changes nothing until something restarts
    # the pod. Without this, a config change and an image bump applied in the
    # wrong order leave both merged and neither in effect.
    configmap.reloader.stakater.com/reload: "cell-explorer-config"
spec:
  # One replica per spot node, so a reclaim or restart leaves one serving.
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: cell-explorer
  template:
    metadata:
      labels:
        app: cell-explorer
    spec:
      nodeSelector:
        workload: cell-explorer
      tolerations:
        - key: "workload"
          operator: "Equal"
          value: "cell-explorer"
          effect: "NoSchedule"
      # Prefer one pod per node. Soft, so while a node drains (still a cordoned
      # node in the cluster) the evicted pod can double up on the other one
      # instead of sitting Pending. matchLabelKeys counts only pods of the same
      # rollout; otherwise the outgoing pods push every new pod onto one node.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: cell-explorer
          matchLabelKeys:
            - pod-template-hash
      containers:
        - name: cell-explorer
          image: ghcr.io/cbioportal/cell-explorer-py:sha-606be20@sha256:b148b724e677b8d926442c4077f2630d31e48ef2895cff218d1417cbb769b70e
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: cell-explorer-config
            - secretRef:
                name: cell-explorer-secrets
          volumeMounts:
            # AWS credentials for Bedrock (account 490004633549); the container
            # runs as root, so HOME=/root and the SDK reads /root/.aws/credentials.
            - name: aws-creds
              mountPath: /root/.aws
              readOnly: true
          # Alembic migrations run before uvicorn serves /health; give a slow
          # first-boot migration up to 5min before liveness/readiness apply.
          startupProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 3
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2"
              memory: "4Gi"
      volumes:
        - name: aws-creds
          secret:
            secretName: k8s-aws-creds-manager
---
apiVersion: v1
kind: Service
metadata:
  name: cell-explorer
  namespace: cell-explorer
spec:
  selector:
    app: cell-explorer
  ports:
    - port: 8000
      targetPort: 8000
      name: http
  type: ClusterIP
