# Traefik services that serve the public API pool exactly as before and also
# send a share of requests to cbioportal-go-api (apps/cbioportal-go), whose
# responses are discarded: a load and parity test of the Go backend on real API
# traffic. Clients only ever see the Java responses.
#
# One service per color, so the import pipeline's color swap
# (cmo-pipelines transfer-deployment-color.sh) switches routes between them by
# renaming -green <-> -blue in the routes that use them: www.cbioportal.org's
# non-browser catch-all (cbio-www-ingressroute in apps/cbioportal).
#
# To stop mirroring, point that route back at
# cbioportal-backend-public-api-<color> (port 80), then delete this file.
apiVersion: traefik.io/v1alpha1
kind: TraefikService
metadata:
  name: cbioportal-api-mirror-green
  namespace: default
spec:
  mirroring:
    name: cbioportal-backend-public-api-green
    port: 80
    # Mirror POST bodies up to 1 MiB; larger requests are not mirrored.
    mirrorBody: true
    maxBodySize: 1048576
    mirrors:
      - name: cbioportal-go-api
        port: 80
        percent: 10
---
apiVersion: traefik.io/v1alpha1
kind: TraefikService
metadata:
  name: cbioportal-api-mirror-blue
  namespace: default
spec:
  mirroring:
    name: cbioportal-backend-public-api-blue
    port: 80
    mirrorBody: true
    maxBodySize: 1048576
    mirrors:
      - name: cbioportal-go-api
        port: 80
        percent: 10
