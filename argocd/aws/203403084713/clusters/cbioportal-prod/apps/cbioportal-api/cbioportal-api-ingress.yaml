# api.cbioportal.org: the public REST API, answered by the Go backend through
# cbioportal-go-api-weighted (apps/cbioportal-go), which Argo Rollouts splits
# between releases during a canary. An IngressRoute, because a plain Ingress
# can only point at a Kubernetes Service. Browsers are refused
# (uablock-browser); they use www.cbioportal.org.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: cbioportal-api-ingressroute
  namespace: default
  labels:
    app.kubernetes.io/instance: cbioportal-api
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`api.cbioportal.org`)
      kind: Rule
      middlewares:
        - name: uablock-browser
          namespace: default
      services:
        - name: cbioportal-go-api-weighted
          kind: TraefikService
  tls:
    secretName: api-cbio-cert
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: api-cbio-cert
  namespace: default
  labels:
    app.kubernetes.io/instance: cbioportal-api
spec:
  secretName: api-cbio-cert
  dnsNames:
    - api.cbioportal.org
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
    group: cert-manager.io
  usages:
    - digital signature
    - key encipherment
