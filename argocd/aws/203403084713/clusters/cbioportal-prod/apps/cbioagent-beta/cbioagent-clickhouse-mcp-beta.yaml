# TEST ONLY: study filtering pinned to beta_blue; revert after the test.
# Image and database are fixed, with Keel and Reloader disabled for this window.
# The daily clone still rebuilds alternating buffers: end the test before blue
# becomes its target again. Only beta LibreChat uses this in-cluster Service.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cbioagent-clickhouse-mcp-beta
  labels:
    run: cbioagent-clickhouse-mcp-beta
spec:
  replicas: 1
  selector:
    matchLabels:
      run: cbioagent-clickhouse-mcp-beta
  template:
    metadata:
      labels:
        run: cbioagent-clickhouse-mcp-beta
    spec:
      containers:
        - name: cbioagent-clickhouse-mcp-beta
          image: cbioportal/mcp@sha256:c98e94a3809c559e768d9eb00b3b2970b6e6118f487c4020207007409c9a35c1
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          env:
            # Node-local Datadog agent IP exposed via Downward API.
            # The telemetry module uses this to build the OTLP gRPC endpoint
            # (http://<DD_AGENT_HOST>:4318) unless OTEL_EXPORTER_OTLP_ENDPOINT
            # is set explicitly.
            - name: DD_AGENT_HOST
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
            # Separate service / ML app so beta traffic doesn't mix into
            # the prod cbioportal-mcp dashboards and LLM Obs.
            - name: OTEL_SERVICE_NAME
              value: "cbioportal-mcp-beta"
            - name: DD_LLMOBS_ML_APP
              value: "cbioportal-mcp-beta"
            - name: DD_SITE
              value: "datadoghq.com"
            # Same sub-path as prod so the beta LibreChat URL keeps the
            # /db/mcp shape (no trailing slash; see librechat-config.yaml).
            - name: CLICKHOUSE_MCP_HTTP_PATH
              value: "/db/mcp"
            # Trust X-Forwarded-* from any in-cluster source (see the prod
            # manifest). Only reachable via this in-cluster Service.
            - name: CLICKHOUSE_MCP_FORWARDED_ALLOW_IPS
              value: "*"
            # Opt-in ClickHouse query cache pilot (cbioportal-mcp#152) is
            # left OFF by default. To pilot it on beta, uncomment below.
            # If you do, also set DROP_QUERY_CACHE=true on the beta clone job
            # so the cache is dropped before each buffer flip (that drop is
            # server-wide and empties prod's cache too). The pilot needs
            # readonly=2 (or CHANGEABLE_IN_READONLY constraints) on
            # llm_user_beta; default readonly=1 disables the cache pilot.
            # - name: CBIOPORTAL_MCP_QUERY_CACHE_ENABLED
            #   value: "true"
            # Explicit env overrides both envFrom sources, including the clone's
            # mutable clickhouse-mcp-active-beta pointer, even after a restart.
            - name: CLICKHOUSE_DATABASE
              value: "cbioportal_public_librechat_beta_blue"
            - name: CBIOPORTAL_MCP_STUDY_FILTERING
              value: "on"
            - name: CBIOPORTAL_MCP_AUTH_ENFORCEMENT
              value: "enforce"
            - name: CBIOPORTAL_MCP_AUTH_TEST_USERS
              value: ""
            - name: CBIOPORTAL_MCP_PUBLIC_DB_CHECK
              value: "enforce"
            # llm_user_beta's SELECT on beta_green is revoked for the test window, so no other database is declared.
            - name: CBIOPORTAL_MCP_STUDY_FILTERING_PUBLIC_DATABASES
              value: ""
            # Required for the trusted LibreChat bridge identity headers.
            - name: CBIOPORTAL_MCP_BRIDGE_SECRET
              valueFrom:
                secretKeyRef:
                  name: cbioportal-mcp-bridge
                  key: CBIOPORTAL_MCP_BRIDGE_SECRET
          envFrom:
            # Dedicated read-only ClickHouse credentials (llm_user_beta).
            - secretRef:
                name: clickhouse-mcp-beta
            # Last envFrom source overrides Secret duplicates; explicit env
            # above overrides both, so the clone cannot move this MCP off blue.
            - configMapRef:
                name: clickhouse-mcp-active-beta
      nodeSelector:
        workload: "cbioagent"
      tolerations:
        - key: "workload"
          operator: "Equal"
          value: "cbioagent"
          effect: "NoSchedule"
---
apiVersion: v1
kind: Service
metadata:
  name: cbioagent-clickhouse-mcp-beta
spec:
  selector:
    run: cbioagent-clickhouse-mcp-beta
  ports:
    - port: 80
      name: http
      targetPort: 8000
  type: ClusterIP
