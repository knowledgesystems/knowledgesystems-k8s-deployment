apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cbioagent-beta-sandbox-ingress
  namespace: default
  labels:
    app.kubernetes.io/instance: cbioagent-beta
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    kubernetes.io/ingress.class: nginx
    kubernetes.io/tls-acme: "true"
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    service.beta.kubernetes.io/aws-load-balancer-proxy-protocol: "*"
spec:
  tls:
    - hosts:
        - sandbox-ui.chat.cbioportal.org
      secretName: sandbox-ui-chat-cbioportal
  rules:
    - host: sandbox-ui.chat.cbioportal.org
      http:
        paths:
          # Only the MCP App sandbox route is exposed on this origin.
          - path: /api/mcp/sandbox
            pathType: Prefix
            backend:
              service:
                name: cbioagent-librechat-beta
                port:
                  number: 3080
