# hub.cbioportal.org is the curation team's staging portal. It takes the same
# user and password as java.cbioportal.org (the htpasswd entries in the
# cbioportal-java-reference-auth Secret's `users` key), so it stays private.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: hub-auth
  namespace: default
  labels:
    app.kubernetes.io/instance: cbioportal-hub
spec:
  basicAuth:
    secret: cbioportal-java-reference-auth
    removeHeader: true
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  annotations:
    acme.cert-manager.io/http01-ingress-class: traefik
    cert-manager.io/cluster-issuer: letsencrypt-prod
    kubernetes.io/ingress.class: traefik
    kubernetes.io/tls-acme: "true"
    # Every request needs java.cbioportal.org's user and password (hub-auth).
    traefik.ingress.kubernetes.io/router.middlewares: default-hub-auth@kubernetescrd
  labels:
    app.kubernetes.io/instance: cbioportal-hub
  name: cbioportal-hub-ingress
  namespace: default
spec:
  rules:
    - host: hub.cbioportal.org
      http:
        paths:
          - backend:
              service:
                name: cbioportal-go-hub
                port:
                  number: 80
            path: /
            pathType: Prefix
  tls:
    - hosts:
        - hub.cbioportal.org
      secretName: hub-cbioportal-cert
