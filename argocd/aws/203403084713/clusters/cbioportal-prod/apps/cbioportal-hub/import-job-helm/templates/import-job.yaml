# Imports the studies of one datahub PR commit into the PR's own preview
# databases (dev_cbioportal_go_prdatahub<N>, _raw, _ref; served by
# deployment.yaml) with cbioportal-go's ops/cbioportal.org/hub-import.sh
# (shipped in the image at /app/deploy): checkout of the changed studies, an
# import of them, and a Check Run plus a Deployment on the PR. With
# `hub-preview: pr-studies-plus-hub` in the PR description, the first import
# starts from a copy of hub.cbioportal.org (HUB_DB). Jobs of one PR's commits run
# one at a time through a lock in the preview's raw database.
apiVersion: batch/v1
kind: Job
metadata:
  name: datahub-import-{{ .Values.prNumber }}-{{ .Values.headSha | trunc 7 }}
  annotations:
    argocd.argoproj.io/sync-options: Replace=true
spec:
  ttlSecondsAfterFinished: 86400
  # The script reports failures on the PR; a retry would post a second run.
  backoffLimit: 0
  # Waiting for another import (LOCK_WAIT) plus the import itself; a
  # preview built by another importer version than the hub's builds every
  # study (about half an hour for all of datahub).
  activeDeadlineSeconds: 14400
  template:
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: importer
          image: cbioportal/cbioportal-go:latest
          imagePullPolicy: Always
          command: ["/app/deploy/hub-import.sh"]
          env:
            - name: PR_NUMBER
              value: {{ .Values.prNumber | quote }}
            - name: HEAD_SHA
              value: {{ .Values.headSha | quote }}
            # hub.cbioportal.org: `hub-preview: pr-studies-plus-hub` copies its databases,
            # and the validator reads its reference data from its API.
            - name: HUB_DB
              value: dev_cbioportal_hub_go
            # The hub's API inside the cluster, past the ingress's password.
            - name: HUB_API
              value: http://cbioportal-go-hub.default.svc.cluster.local
            - name: HUB_PR_BASE
              value: https://{{ include "dhpreview.host" . }}
            - name: WORKDIR
              value: /work
            - name: HOME
              value: /work
            - name: LOCK_WAIT
              value: "7200"
            - name: LOG_URL
              value: "https://argocd.cbioportal.org/applications/datahub-import-{{ .Values.prNumber }}?resource=&node=batch%2FJob%2Fdefault%2Fdatahub-import-{{ .Values.prNumber }}-{{ .Values.headSha | trunc 7 }}%2F0&tab=logs"
            # Tags the import's queries in ClickHouse's system.query_log.
            - name: CLICKHOUSE_LOG_COMMENT
              value: hub-import-{{ .Values.prNumber }}
            # GitHub App that posts the Check Run and Deployment; without the
            # Secret the import runs and posts nothing.
            - name: GH_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: hub-preview-bot
                  key: client-id
                  optional: true
            - name: GH_INSTALLATION_ID
              valueFrom:
                secretKeyRef:
                  name: hub-preview-bot
                  key: installation-id
                  optional: true
            - name: GH_APP_KEY
              value: /etc/gh-app/key.pem
          # CLICKHOUSE_URL, CLICKHOUSE_USER (go_import), CLICKHOUSE_PASSWORD
          envFrom:
            - secretRef:
                name: clickhouse-go-import
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
              ephemeral-storage: 1Gi
            limits:
              cpu: "2"
              memory: 2Gi
              ephemeral-storage: 15Gi
          volumeMounts:
            - name: work
              mountPath: /work
            - name: gh-app-key
              mountPath: /etc/gh-app
              readOnly: true
      volumes:
        # One study's files at a time; each is deleted after its ingest.
        - name: work
          emptyDir:
            sizeLimit: 15Gi
        - name: gh-app-key
          secret:
            secretName: hub-preview-bot
            optional: true
            items:
              - key: private-key
                path: key.pem
      nodeSelector:
        workload: cbio-dev
      tolerations:
        - key: "workload"
          operator: "Equal"
          value: "cbio-dev"
          effect: "NoSchedule"
