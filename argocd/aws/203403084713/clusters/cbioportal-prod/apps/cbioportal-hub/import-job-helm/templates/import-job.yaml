# Imports the studies of one datahub PR commit into hub.cbioportal.org with
# cbioportal-go's ops/cbioportal.org/hub-import.sh (shipped in the image at /app/deploy):
# checkout of the changed studies, `cbioportal-import ingest` of each, one
# `transform` of the hub database, and a Check Run plus a Deployment on the
# PR. Jobs of different PRs run one at a time through a lock in ClickHouse.
apiVersion: batch/v1
kind: Job
metadata:
  name: datahub-import-{{ .Values.prNumber }}-{{ .Values.headSha | trunc 7 }}
  annotations:
    argocd.argoproj.io/sync-options: Replace=true
spec:
  ttlSecondsAfterFinished: 86400
  # The script reports failures on the PR; a retry would post a second run.
  backoffLimit: 0
  # Waiting for other imports (LOCK_WAIT) plus the import itself.
  activeDeadlineSeconds: 14400
  template:
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: importer
          image: cbioportal/cbioportal-go:latest
          imagePullPolicy: Always
          command: ["/app/deploy/hub-import.sh"]
          env:
            - name: PR_NUMBER
              value: {{ .Values.prNumber | quote }}
            - name: HEAD_SHA
              value: {{ .Values.headSha | quote }}
            - name: HUB_DB
              value: dev_cbioportal_hub_go
            - name: HUB_BASE
              value: https://hub.cbioportal.org
            - name: WORKDIR
              value: /work
            - name: HOME
              value: /work
            - name: LOCK_WAIT
              value: "7200"
            - name: LOG_URL
              value: "https://argocd.cbioportal.org/applications/datahub-import-{{ .Values.prNumber }}?resource=&node=batch%2FJob%2Fdefault%2Fdatahub-import-{{ .Values.prNumber }}-{{ .Values.headSha | trunc 7 }}%2F0&tab=logs"
            # Tags the import's queries in ClickHouse's system.query_log.
            - name: CLICKHOUSE_LOG_COMMENT
              value: hub-import-{{ .Values.prNumber }}
            # GitHub App that posts the Check Run and Deployment; without the
            # Secret the import runs and posts nothing.
            - name: GH_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: hub-preview-bot
                  key: client-id
                  optional: true
            - name: GH_INSTALLATION_ID
              valueFrom:
                secretKeyRef:
                  name: hub-preview-bot
                  key: installation-id
                  optional: true
            - name: GH_APP_KEY
              value: /etc/gh-app/key.pem
          # CLICKHOUSE_URL, CLICKHOUSE_USER (go_import), CLICKHOUSE_PASSWORD
          envFrom:
            - secretRef:
                name: clickhouse-go-import
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
              ephemeral-storage: 1Gi
            limits:
              cpu: "2"
              memory: 2Gi
              ephemeral-storage: 15Gi
          volumeMounts:
            - name: work
              mountPath: /work
            - name: gh-app-key
              mountPath: /etc/gh-app
              readOnly: true
      volumes:
        # One study's files at a time; each is deleted after its ingest.
        - name: work
          emptyDir:
            sizeLimit: 15Gi
        - name: gh-app-key
          secret:
            secretName: hub-preview-bot
            optional: true
            items:
              - key: private-key
                path: key.pem
      nodeSelector:
        workload: cbio-dev
      tolerations:
        - key: "workload"
          operator: "Equal"
          value: "cbio-dev"
          effect: "NoSchedule"
