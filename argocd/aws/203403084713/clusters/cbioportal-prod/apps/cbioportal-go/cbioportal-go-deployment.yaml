apiVersion: apps/v1
kind: Deployment
metadata:
  name: cbioportal-go
  namespace: default
  labels:
    run: cbioportal-go
  annotations:
    # Rolls the pod when the import CronJob flips the blue/green pointer or
    # when the ClickHouse credentials change.
    configmap.reloader.stakater.com/reload: "cbioportal-go-active"
    secret.reloader.stakater.com/reload: "clickhouse-go-portal,cbioportal-public-green"
    # Keel polls Docker Hub and rolls the Deployment when the digest behind
    # cbioportal/cbioportal-go:latest changes.
    keel.sh/policy: force
    keel.sh/trigger: poll
    keel.sh/match-tag: "true"
spec:
  # Single replica: the session store is one JSON file on the PVC.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      run: cbioportal-go
  template:
    metadata:
      annotations:
        # Datadog scrapes the Prometheus metrics (METRICS_ADDR below).
        ad.datadoghq.com/cbioportal-go.checks: |
          {"openmetrics": {"instances": [{"openmetrics_endpoint": "http://%%host%%:9090/metrics",
            "namespace": "cbioportal_go", "metrics": [".*"]}]}}
      labels:
        run: cbioportal-go
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: cbioportal-go
          image: cbioportal/cbioportal-go:latest
          imagePullPolicy: Always
          command: ["/usr/local/bin/cbioportal-api"]
          # www.cbioportal.org's portal settings (generated from its
          # /config_service; analytics and login left out), shipped in the image.
          args:
            - --portal-properties=/app/deploy/public-portal.properties
          ports:
            - containerPort: 8080
              protocol: TCP
            - containerPort: 9090
              name: metrics
              protocol: TCP
          env:
            - name: PORT
              value: "8080"
            # Prometheus metrics on a port the Service does not expose, and a
            # JSON access log line per request.
            - name: METRICS_ADDR
              value: ":9090"
            - name: ACCESS_LOG
              value: "true"
            - name: FRONTEND_DIR
              value: /app/frontend
            - name: SITE_BANNER
              value: "⚠️ Experimental preview: a reimplementation of cBioPortal in Go. Results may differ from the official portal; do not use for research or clinical decisions. Official portal:"
            - name: SITE_BANNER_LINK
              value: https://www.cbioportal.org
            - name: SESSION_STORE_FILE
              value: /data/sessions.json
            # The public portal's OncoKB token, read from its secret, and the
            # authenticated OncoKB API it is for (the frontend's mutation
            # annotations go through the /proxy endpoint).
            - name: ONCOKB_URL
              value: https://www.oncokb.org/api/v1
            - name: ONCOKB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: cbioportal-public-green
                  key: ONCOKB_TOKEN
            # Tags this deployment's queries in ClickHouse's system.query_log.
            - name: CLICKHOUSE_LOG_COMMENT
              value: go.cbioportal.org
          envFrom:
            - secretRef:
                name: clickhouse-go-portal
            - configMapRef:
                name: cbioportal-go-active
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 5
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: cbioportal-go-data
      nodeSelector:
        workload: cbio-dev
      tolerations:
        - key: "workload"
          operator: "Equal"
          value: "cbio-dev"
          effect: "NoSchedule"
---
apiVersion: v1
kind: Service
metadata:
  name: cbioportal-go
  namespace: default
  labels:
    run: cbioportal-go
spec:
  selector:
    run: cbioportal-go
  ports:
    - port: 80
      name: http
      targetPort: 8080
  type: ClusterIP
