apiVersion: apps/v1
kind: Deployment
metadata:
  name: cbioportal-go
  namespace: default
  labels:
    run: cbioportal-go
  annotations:
    # Rolls the pod when the import CronJob flips the blue/green pointer or
    # when the ClickHouse credentials change.
    configmap.reloader.stakater.com/reload: "cbioportal-go-active"
    secret.reloader.stakater.com/reload: "clickhouse-go-portal,cbioportal-public-green"
    # Keel polls Docker Hub and rolls the Deployment when the digest behind
    # cbioportal/cbioportal-go:latest changes.
    keel.sh/policy: force
    keel.sh/trigger: poll
    keel.sh/match-tag: "true"
spec:
  # Two replicas, rolled one at a time and spread over nodes: sessions live
  # in the session service and logins in Redis, so any pod serves any user.
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      run: cbioportal-go
  template:
    metadata:
      annotations:
        # Datadog scrapes the Prometheus metrics (METRICS_ADDR below).
        ad.datadoghq.com/cbioportal-go.checks: |
          {"openmetrics": {"instances": [{"openmetrics_endpoint": "http://%%host%%:9090/metrics",
            "namespace": "cbioportal_go", "metrics": [".*"]}]}}
      labels:
        run: cbioportal-go
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: cbioportal-go
          image: cbioportal/cbioportal-go:latest
          imagePullPolicy: Always
          command: ["/usr/local/bin/cbioportal-api"]
          # www.cbioportal.org's portal settings (generated from its
          # /config_service; analytics and login left out), shipped in the image.
          args:
            - --portal-properties=/app/deploy/public-portal.properties
            # Optional Google sign-in as on www. ${...} placeholders are
            # resolved by the API from the env vars below, so the secrets
            # never appear in the process args.
            - --authenticate=optional_oauth2
            - --authorization=false
            - --security.method_authorization_enabled=false
            - --always_show_study_group=PUBLIC
            - --spring.security.oauth2.client.registration.google.clientId=${GOOGLE_PLUS_CONSUMER_KEY}
            - --spring.security.oauth2.client.registration.google.clientSecret=${GOOGLE_PLUS_CONSUMER_SECRET}
            - --spring.security.oauth2.client.provider.google.user-name-attribute=email
            # Login sessions in the public portal's session Redis, so they
            # survive restarts.
            - --spring.session.store-type=redis
            - --spring.data.redis.host=${REDIS_SESSION_HOST}
            - --spring.data.redis.port=${REDIS_SESSION_PORT}
            - --spring.data.redis.password=${REDIS_SESSION_PASSWORD}
          ports:
            - containerPort: 8080
              protocol: TCP
            - containerPort: 9090
              name: metrics
              protocol: TCP
          env:
            - name: PORT
              value: "8080"
            # Prometheus metrics on a port the Service does not expose, and a
            # JSON access log line per request.
            - name: METRICS_ADDR
              value: ":9090"
            - name: ACCESS_LOG
              value: "true"
            - name: FRONTEND_DIR
              value: /app/frontend
            - name: SITE_BANNER
              value: "⚠️ Experimental preview: a reimplementation of cBioPortal in Go. Results may differ from the official portal; do not use for research or clinical decisions. Official portal:"
            - name: SITE_BANNER_LINK
              value: https://www.cbioportal.org
            # Sessions (shared links, virtual studies, groups) in the public
            # portal's session service, with its credentials from its secret,
            # so www links open here too.
            - name: SESSION_SERVICE_URL
              value: https://session-service.cbioportal.org/api/sessions/public_portal/
            - name: SESSION_SERVICE_USER
              valueFrom:
                secretKeyRef:
                  name: cbioportal-public-green
                  key: SESSION_SERVICE_USER_NAME
            - name: SESSION_SERVICE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: cbioportal-public-green
                  key: SESSION_SERVICE_USER_PASSWORD
            # The public portal's OncoKB token, read from its secret, and the
            # authenticated OncoKB API it is for (the frontend's mutation
            # annotations go through the /proxy endpoint).
            - name: ONCOKB_URL
              value: https://www.oncokb.org/api/v1
            - name: ONCOKB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: cbioportal-public-green
                  key: ONCOKB_TOKEN
            - name: GOOGLE_PLUS_CONSUMER_KEY
              valueFrom:
                secretKeyRef:
                  name: cbioportal-public-green
                  key: GOOGLE_PLUS_CONSUMER_KEY
            - name: GOOGLE_PLUS_CONSUMER_SECRET
              valueFrom:
                secretKeyRef:
                  name: cbioportal-public-green
                  key: GOOGLE_PLUS_CONSUMER_SECRET
            - name: REDIS_SESSION_HOST
              valueFrom:
                secretKeyRef:
                  name: cbioportal-public-green
                  key: REDIS_SESSION_HOST
            - name: REDIS_SESSION_PORT
              valueFrom:
                secretKeyRef:
                  name: cbioportal-public-green
                  key: REDIS_SESSION_PORT
            - name: REDIS_SESSION_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: cbioportal-public-green
                  key: REDIS_SESSION_PASSWORD
            # Tags this deployment's queries in ClickHouse's system.query_log.
            - name: CLICKHOUSE_LOG_COMMENT
              value: go.cbioportal.org
            # Go's soft heap limit, about 80% of the 2Gi memory limit, so the
            # garbage collector works harder before the container is OOM-killed.
            - name: GOMEMLIMIT
              value: "1600MiB"
          envFrom:
            - secretRef:
                name: clickhouse-go-portal
            - configMapRef:
                name: cbioportal-go-active
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 5
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              run: cbioportal-go
      nodeSelector:
        workload: cbio-dev
      tolerations:
        - key: "workload"
          operator: "Equal"
          value: "cbio-dev"
          effect: "NoSchedule"
---
apiVersion: v1
kind: Service
metadata:
  name: cbioportal-go
  namespace: default
  labels:
    run: cbioportal-go
spec:
  selector:
    run: cbioportal-go
  ports:
    - port: 80
      name: http
      targetPort: 8080
  type: ClusterIP
---
# Keeps one pod serving while nodes are drained (the cbio-dev spot pool is
# consolidated and replaced often).
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: cbioportal-go
  namespace: default
spec:
  minAvailable: 1
  selector:
    matchLabels:
      run: cbioportal-go
