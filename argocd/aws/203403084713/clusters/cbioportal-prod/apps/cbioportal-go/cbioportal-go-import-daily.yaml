# Daily datahub import into the inactive blue/green ClickHouse databases,
# then a flip of the cbioportal-go-active pointer. Pod runs import →
# patch-pointer; Reloader rolls cbioportal-go when the pointer changes.
#
# The import script ships in the inodb/cbioportal-go image
# (/app/deploy/import-datahub.sh). It reads the live pointer from ACTIVE_DB,
# builds into the other color, and writes the new pointer values to
# /work/state.env.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cbioportal-go-import-job
  namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cbioportal-go-import-job-role
  namespace: default
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["cbioportal-go-active"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cbioportal-go-import-job-binding
  namespace: default
subjects:
  - kind: ServiceAccount
    name: cbioportal-go-import-job
    namespace: default
roleRef:
  kind: Role
  name: cbioportal-go-import-job-role
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: cbioportal-go-import-daily
  namespace: default
  labels:
    app.kubernetes.io/instance: cbioportal-go
spec:
  schedule: "0 6 * * *"  # daily 06:00 UTC
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      activeDeadlineSeconds: 14400
      # A failed import leaves the pointer on the previous databases; the
      # next scheduled run retries.
      backoffLimit: 0
      template:
        spec:
          serviceAccountName: cbioportal-go-import-job
          restartPolicy: Never
          securityContext:
            fsGroup: 10001
          nodeSelector:
            workload: cbio-dev
          tolerations:
            - key: "workload"
              operator: "Equal"
              value: "cbio-dev"
              effect: "NoSchedule"
          volumes:
            - name: work
              emptyDir:
                sizeLimit: 30Gi
          initContainers:
            - name: import
              image: inodb/cbioportal-go:latest
              imagePullPolicy: Always
              command: ["/app/deploy/import-datahub.sh"]
              securityContext:
                runAsNonRoot: true
                runAsUser: 10001
                runAsGroup: 10001
              env:
                - name: DB_PREFIX
                  value: dev_cbioportal_public_go
                - name: WORKDIR
                  value: /work
                - name: DATAHUB_REPO
                  value: https://github.com/cBioPortal/datahub.git
                - name: DATAHUB_REF
                  value: master
                - name: STUDIES_FILE
                  value: /app/deploy/datahub-studies.txt
                - name: ACTIVE_DB
                  valueFrom:
                    configMapKeyRef:
                      name: cbioportal-go-active
                      key: CBIOPORTAL_DB
                      optional: true
              envFrom:
                - secretRef:
                    name: clickhouse-go-import
              resources:
                requests:
                  cpu: "1"
                  memory: 2Gi
                  ephemeral-storage: 10Gi
                limits:
                  cpu: "2"
                  memory: 4Gi
                  ephemeral-storage: 32Gi
              volumeMounts:
                - mountPath: /work
                  name: work
          containers:
            - name: patch-pointer
              image: bitnami/kubectl:latest
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -eu
                  . /work/state.env
                  : "${CBIOPORTAL_DB:?missing from state.env}"
                  : "${CBIOPORTAL_RAW_DB:?missing from state.env}"
                  : "${CBIOPORTAL_REF_DB:?missing from state.env}"
                  echo "patching cbioportal-go-active → ${CBIOPORTAL_DB} / ${CBIOPORTAL_RAW_DB} / ${CBIOPORTAL_REF_DB}"
                  kubectl -n default patch configmap cbioportal-go-active --type=merge \
                    -p "{\"data\":{\"CBIOPORTAL_DB\":\"${CBIOPORTAL_DB}\",\"CBIOPORTAL_RAW_DB\":\"${CBIOPORTAL_RAW_DB}\",\"CBIOPORTAL_REF_DB\":\"${CBIOPORTAL_REF_DB}\"}}"
              resources:
                requests:
                  cpu: 10m
                  memory: 32Mi
                limits:
                  memory: 128Mi
              volumeMounts:
                - mountPath: /work
                  name: work
                  readOnly: true
