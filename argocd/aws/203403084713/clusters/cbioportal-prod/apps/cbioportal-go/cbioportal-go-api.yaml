# cbioportal-go serving the REST API only: api.cbioportal.org
# (apps/cbioportal-api/cbioportal-api-ingress.yaml) and www.cbioportal.org's
# non-browser API traffic, scripts and agents (cbio-www-ingressroute in
# apps/cbioportal). Stateless (no session file), so it scales out. Same
# databases as go.cbioportal.org.
#
# It runs a pinned release on the on-demand cbio-api nodes:
# https://github.com/cBioPortal/cbioportal-go/releases
#
# An Argo Rollout (apps/argocd/argo-rollouts.yaml) rather than a Deployment:
# - A new release (a new image tag here) goes out as a canary. Argo Rollouts
#   moves 5%, then 25%, then 50% of the traffic to the new pods, through the
#   weighted service cbioportal-go-api-weighted that both routes use. It
#   checks the new pods' 5xx rate in Datadog throughout (AnalysisTemplate
#   below), and goes back to the old release on its own if the check fails.
# - A database switch (the mirror job changing cbioportal-go-active) is not a
#   release. Reloader restarts the pods one at a time (rollout-strategy
#   restart, which sets spec.restartAt), without the canary steps.
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: cbioportal-go-api
  namespace: default
  labels:
    run: cbioportal-go-api
  annotations:
    configmap.reloader.stakater.com/reload: "cbioportal-go-active"
    secret.reloader.stakater.com/reload: "clickhouse-go-portal"
    reloader.stakater.com/rollout-strategy: "restart"
spec:
  replicas: 2
  revisionHistoryLimit: 3
  strategy:
    canary:
      stableService: cbioportal-go-api
      canaryService: cbioportal-go-api-canary
      trafficRouting:
        traefik:
          weightedTraefikServiceName: cbioportal-go-api-weighted
      analysis:
        templates:
          - templateName: cbioportal-go-api-errors
        startingStep: 1
        args:
          - name: canary-hash
            valueFrom:
              podTemplateHashValue: Latest
      steps:
        - setWeight: 5
        - pause: {duration: 30m}
        - setWeight: 25
        - pause: {duration: 30m}
        - setWeight: 50
        - pause: {duration: 15m}
  selector:
    matchLabels:
      run: cbioportal-go-api
  template:
    metadata:
      annotations:
        # Datadog scrapes the Prometheus metrics (METRICS_ADDR below).
        ad.datadoghq.com/cbioportal-go-api.checks: |
          {"openmetrics": {"instances": [{"openmetrics_endpoint": "http://%%host%%:9090/metrics",
            "namespace": "cbioportal_go", "metrics": [".*"]}]}}
      labels:
        run: cbioportal-go-api
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
      containers:
        - name: cbioportal-go-api
          image: cbioportal/cbioportal-go:0.1.0
          imagePullPolicy: IfNotPresent
          command: ["/usr/local/bin/cbioportal-api"]
          args:
            - --portal-properties=/app/deploy/public-portal.properties
          ports:
            - containerPort: 8080
              protocol: TCP
            - containerPort: 9090
              name: metrics
              protocol: TCP
          env:
            - name: PORT
              value: "8080"
            # Prometheus metrics on a port the Service does not expose, and a
            # JSON access log line per request.
            - name: METRICS_ADDR
              value: ":9090"
            - name: ACCESS_LOG
              value: "true"
            # Tags this deployment's queries in ClickHouse's system.query_log.
            - name: CLICKHOUSE_LOG_COMMENT
              value: cbioportal-go-api
          envFrom:
            - secretRef:
                name: clickhouse-go-portal
            - configMapRef:
                name: cbioportal-go-active
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 5
          # A mirrored quarter of the non-browser traffic used about 0.04
          # cores and 0.15 GB over both pods on average, and at most about
          # 1.2 cores.
          resources:
            requests:
              cpu: "1"
              memory: 512Mi
            limits:
              cpu: "3"
              memory: 2Gi
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              run: cbioportal-go-api
      nodeSelector:
        workload: cbio-api
      tolerations:
        - key: "workload"
          operator: "Equal"
          value: "cbio-api"
          effect: "NoSchedule"
---
apiVersion: v1
kind: Service
metadata:
  name: cbioportal-go-api
  namespace: default
  labels:
    run: cbioportal-go-api
spec:
  selector:
    run: cbioportal-go-api
  ports:
    - port: 80
      name: http
      targetPort: 8080
  type: ClusterIP
---
# The new release's pods during a canary (Argo Rollouts adds the pod template
# hash to its selector).
apiVersion: v1
kind: Service
metadata:
  name: cbioportal-go-api-canary
  namespace: default
  labels:
    run: cbioportal-go-api
spec:
  selector:
    run: cbioportal-go-api
  ports:
    - port: 80
      name: http
      targetPort: 8080
  type: ClusterIP
---
# The service the routes use. Argo Rollouts sets the two weights during a
# canary; outside one, all traffic goes to the stable pods.
apiVersion: traefik.io/v1alpha1
kind: TraefikService
metadata:
  name: cbioportal-go-api-weighted
  namespace: default
spec:
  weighted:
    services:
      - name: cbioportal-go-api
        port: 80
        weight: 100
      - name: cbioportal-go-api-canary
        port: 80
        weight: 0
---
# The canary check: the new pods' share of 5xx answers, every 5 minutes. Two
# failed checks abort the canary and send all traffic back to the old pods.
# Reads the Datadog Secret of the argo-rollouts namespace
# (apps/argocd/argo-rollouts.yaml).
apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: cbioportal-go-api-errors
  namespace: default
spec:
  args:
    - name: canary-hash
  metrics:
    - name: error-rate
      interval: 5m
      failureLimit: 1
      successCondition: default(result, 0) < 0.01
      provider:
        datadog:
          apiVersion: v2
          interval: 5m
          queries:
            errors: sum:cbioportal_go.cbioportal_http_requests.count{kube_replica_set:cbioportal-go-api-{{args.canary-hash}},code:5*}.as_count()
            all: sum:cbioportal_go.cbioportal_http_requests.count{kube_replica_set:cbioportal-go-api-{{args.canary-hash}}}.as_count()
          formula: errors / all
---
# Keeps one pod serving while a node is drained.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: cbioportal-go-api
  namespace: default
spec:
  minAvailable: 1
  selector:
    matchLabels:
      run: cbioportal-go-api
