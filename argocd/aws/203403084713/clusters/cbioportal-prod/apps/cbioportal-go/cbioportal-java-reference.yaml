# java.cbioportal.org: Java cBioPortal (the release go matches) on go's copy
# of production, the reference that nightly parity compares go with. Not a
# public service: every request needs the password in the Secret
# cbioportal-java-reference-auth, created out of band (see README.md).
#
# It reads the same snapshot go serves: the clone of production's tables in
# the _ref database the pointer ConfigMap names. Reloader restarts it when the
# mirror switches go to a new import, so both always answer from one import.
# It reads sessions (shared links, virtual studies, groups) from the public
# portal's session service, as www does. No login or response cache, so
# every other answer comes from the database.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cbioportal-java-reference
  namespace: default
  labels:
    app.kubernetes.io/instance: cbioportal-go
  annotations:
    configmap.reloader.stakater.com/reload: cbioportal-go-active
    secret.reloader.stakater.com/reload: cbioportal-public-green
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: cbioportal-java-reference
  template:
    metadata:
      labels:
        app: cbioportal-java-reference
    spec:
      containers:
        - name: cbioportal-java-reference
          image: cbioportal/cbioportal:v7.2.3-web-shenandoah
          # The JDBC URL is built from go's ClickHouse URL and the served _ref
          # database. Settings go in custom_http_params: this driver version
          # ignores max_query_size given any other way, and production's
          # largest requests exceed the 256 KiB default.
          command:
            - /bin/sh
            - -c
            - |
              host=${CLICKHOUSE_URL#*://}; host=${host%%/*}
              url="jdbc:clickhouse://${host}/${CBIOPORTAL_REF_DB}?ssl=true&custom_http_params=max_query_size%3D104857600%2Clog_comment%3Dcbioportal-java-reference"
              exec java -Xms100m -Xmx2500m -XX:+UseShenandoahGC -jar /cbioportal-webapp/app.jar \
                --app.name=java-reference \
                --authenticate=false --authorization=false \
                --security.method_authorization_enabled=false \
                --always_show_study_group=PUBLIC --dat.method=none \
                --clickhouse_mode=true --spring.profiles.active=clickhouse \
                --spring.datasource.url="$url" \
                --spring.datasource.mysql.url="$url" \
                --spring.datasource.clickhouse.url="$url" \
                --spring.datasource.driver-class-name=com.clickhouse.jdbc.ClickHouseDriver \
                --spring.datasource.mysql.driver-class-name=com.clickhouse.jdbc.ClickHouseDriver \
                --spring.datasource.clickhouse.driver-class-name=com.clickhouse.jdbc.ClickHouseDriver \
                --persistence.cache_type=no-cache --persistence.cache_type_clickhouse=no-cache \
                --enable_persistent_cache=false \
                --db.suppress_schema_version_mismatch_errors=true \
                --frontend.url=https://frontend.cbioportal.org/ \
                --session.service.url=https://session-service.cbioportal.org/api/sessions/public_portal/ \
                --session.service.origin='*' \
                --session.service.user="$SESSION_SERVICE_USER" \
                --session.service.password="$SESSION_SERVICE_PASSWORD" \
                --sitemaps=false \
                --studyview.max_samples_selected=500000 \
                --server.compression.enabled=true \
                --server.max-http-request-header-size=16384
          env:
            - name: CLICKHOUSE_URL
              valueFrom:
                secretKeyRef:
                  name: clickhouse-go-portal
                  key: CLICKHOUSE_URL
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: clickhouse-go-portal
                  key: CLICKHOUSE_USER
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: clickhouse-go-portal
                  key: CLICKHOUSE_PASSWORD
            - name: SPRING_DATASOURCE_MYSQL_USERNAME
              valueFrom:
                secretKeyRef:
                  name: clickhouse-go-portal
                  key: CLICKHOUSE_USER
            - name: SPRING_DATASOURCE_MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: clickhouse-go-portal
                  key: CLICKHOUSE_PASSWORD
            - name: SPRING_DATASOURCE_CLICKHOUSE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: clickhouse-go-portal
                  key: CLICKHOUSE_USER
            - name: SPRING_DATASOURCE_CLICKHOUSE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: clickhouse-go-portal
                  key: CLICKHOUSE_PASSWORD
            # The public portal's session service credentials, as www's.
            - name: SESSION_SERVICE_USER
              valueFrom:
                secretKeyRef:
                  name: cbioportal-public-green
                  key: SESSION_SERVICE_USER_NAME
            - name: SESSION_SERVICE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: cbioportal-public-green
                  key: SESSION_SERVICE_USER_PASSWORD
            - name: CBIOPORTAL_REF_DB
              valueFrom:
                configMapKeyRef:
                  name: cbioportal-go-active
                  key: CBIOPORTAL_REF_DB
          ports:
            - containerPort: 8080
          # Liveness only checks that the JVM answers, so a ClickHouse outage
          # does not restart it; readiness queries the database.
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 120
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 250m
              memory: 3Gi
            limits:
              memory: 3584Mi
      # Spot is fine: only nightly parity and manual checks use it.
      nodeSelector:
        workload: cbio-dev
      tolerations:
        - key: workload
          operator: Equal
          value: cbio-dev
          effect: NoSchedule
---
apiVersion: v1
kind: Service
metadata:
  name: cbioportal-java-reference
  namespace: default
  labels:
    app.kubernetes.io/instance: cbioportal-go
spec:
  selector:
    app: cbioportal-java-reference
  ports:
    - port: 80
      targetPort: 8080
---
# Every request needs a user and password from the htpasswd entries in the
# Secret's `users` key.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: java-reference-auth
  namespace: default
  labels:
    app.kubernetes.io/instance: cbioportal-go
spec:
  basicAuth:
    secret: cbioportal-java-reference-auth
    removeHeader: true
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: cbioportal-java-reference
  namespace: default
  labels:
    app.kubernetes.io/instance: cbioportal-go
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`java.cbioportal.org`)
      kind: Rule
      middlewares:
        - name: java-reference-auth
          namespace: default
      services:
        - name: cbioportal-java-reference
          port: 80
  tls:
    secretName: java-cbio-cert
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: java-cbio-cert
  namespace: default
  labels:
    app.kubernetes.io/instance: cbioportal-go
spec:
  secretName: java-cbio-cert
  dnsNames:
    - java.cbioportal.org
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
    group: cert-manager.io
  usages:
    - digital signature
    - key encipherment
