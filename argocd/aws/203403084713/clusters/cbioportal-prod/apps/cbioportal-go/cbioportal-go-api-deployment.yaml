# cbioportal-go serving the REST API only, for a share of api.cbioportal.org
# traffic mirrored to it (apps/cbioportal-api/cbioportal-api-mirror.yaml):
# its responses are discarded, so this measures load, latency and errors on
# real API traffic without affecting clients. Stateless (no session file), so
# it scales out. Same databases as go.cbioportal.org.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cbioportal-go-api
  namespace: default
  labels:
    run: cbioportal-go-api
  annotations:
    configmap.reloader.stakater.com/reload: "cbioportal-go-active"
    secret.reloader.stakater.com/reload: "clickhouse-go-portal"
    keel.sh/policy: force
    keel.sh/trigger: poll
    keel.sh/match-tag: "true"
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      run: cbioportal-go-api
  template:
    metadata:
      annotations:
        # Datadog scrapes the Prometheus metrics (METRICS_ADDR below).
        ad.datadoghq.com/cbioportal-go-api.checks: |
          {"openmetrics": {"instances": [{"openmetrics_endpoint": "http://%%host%%:9090/metrics",
            "namespace": "cbioportal_go", "metrics": [".*"]}]}}
      labels:
        run: cbioportal-go-api
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
      containers:
        - name: cbioportal-go-api
          image: cbioportal/cbioportal-go:latest
          imagePullPolicy: Always
          command: ["/usr/local/bin/cbioportal-api"]
          args:
            - --portal-properties=/app/deploy/public-portal.properties
          ports:
            - containerPort: 8080
              protocol: TCP
            - containerPort: 9090
              name: metrics
              protocol: TCP
          env:
            - name: PORT
              value: "8080"
            # Prometheus metrics on a port the Service does not expose, and a
            # JSON access log line per request.
            - name: METRICS_ADDR
              value: ":9090"
            - name: ACCESS_LOG
              value: "true"
            # Tags this deployment's queries in ClickHouse's system.query_log.
            - name: CLICKHOUSE_LOG_COMMENT
              value: cbioportal-go-api
            # Go's soft heap limit, about 80% of the 2Gi memory limit, so the
            # garbage collector works harder before the container is OOM-killed.
            - name: GOMEMLIMIT
              value: "1600MiB"
          envFrom:
            - secretRef:
                name: clickhouse-go-portal
            - configMapRef:
                name: cbioportal-go-active
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 5
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              run: cbioportal-go-api
      nodeSelector:
        workload: cbio-dev
      tolerations:
        - key: "workload"
          operator: "Equal"
          value: "cbio-dev"
          effect: "NoSchedule"
---
apiVersion: v1
kind: Service
metadata:
  name: cbioportal-go-api
  namespace: default
  labels:
    run: cbioportal-go-api
spec:
  selector:
    run: cbioportal-go-api
  ports:
    - port: 80
      name: http
      targetPort: 8080
  type: ClusterIP
---
# Keeps one pod serving while nodes are drained (the cbio-dev spot pool is
# consolidated and replaced often).
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: cbioportal-go-api
  namespace: default
spec:
  minAvailable: 1
  selector:
    matchLabels:
      run: cbioportal-go-api
