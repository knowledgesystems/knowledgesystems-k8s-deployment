# cbioportal-go serving the REST API only. It serves a weighted share of
# api.cbioportal.org to clients (apps/cbioportal-api/cbioportal-api-canary.yaml)
# and also receives a mirrored share of the Java API pool's traffic
# (apps/cbioportal-api/cbioportal-api-mirror.yaml), whose responses are
# discarded. Stateless (no session file), so it scales out (HPA below). Same
# databases as go.cbioportal.org.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cbioportal-go-api
  namespace: default
  labels:
    run: cbioportal-go-api
  annotations:
    configmap.reloader.stakater.com/reload: "cbioportal-go-active"
    secret.reloader.stakater.com/reload: "clickhouse-go-portal"
    keel.sh/policy: force
    keel.sh/trigger: poll
    keel.sh/match-tag: "true"
spec:
  # Replica count is owned by the HorizontalPodAutoscaler below.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      run: cbioportal-go-api
  template:
    metadata:
      annotations:
        # Datadog scrapes the Prometheus metrics (METRICS_ADDR below).
        ad.datadoghq.com/cbioportal-go-api.checks: |
          {"openmetrics": {"instances": [{"openmetrics_endpoint": "http://%%host%%:9090/metrics",
            "namespace": "cbioportal_go", "metrics": [".*"]}]}}
      labels:
        run: cbioportal-go-api
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
      containers:
        - name: cbioportal-go-api
          image: cbioportal/cbioportal-go:latest
          imagePullPolicy: Always
          command: ["/usr/local/bin/cbioportal-api"]
          args:
            - --portal-properties=/app/deploy/public-portal.properties
            # Served on api.cbioportal.org: robots.txt and sitemaps as on www
            # (the properties file disallows crawling for preview sites).
            - --robots.disallow_all=false
            - --sitemaps=true
          ports:
            - containerPort: 8080
              protocol: TCP
            - containerPort: 9090
              name: metrics
              protocol: TCP
          env:
            - name: PORT
              value: "8080"
            # Prometheus metrics on a port the Service does not expose, and a
            # JSON access log line per request.
            - name: METRICS_ADDR
              value: ":9090"
            - name: ACCESS_LOG
              value: "true"
            # Tags this deployment's queries in ClickHouse's system.query_log.
            - name: CLICKHOUSE_LOG_COMMENT
              value: cbioportal-go-api
            # Go's soft heap limit, about 80% of the 3Gi memory limit, so the
            # garbage collector works harder before the container is OOM-killed.
            - name: GOMEMLIMIT
              value: "2400MiB"
          envFrom:
            - secretRef:
                name: clickhouse-go-portal
            - configMapRef:
                name: cbioportal-go-active
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 5
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: "2"
              # Whole-study bulk responses peak at ~1.5Gi heap in one pod.
              memory: 3Gi
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              run: cbioportal-go-api
      nodeSelector:
        workload: cbio-dev
      tolerations:
        - key: "workload"
          operator: "Equal"
          value: "cbio-dev"
          effect: "NoSchedule"
---
apiVersion: v1
kind: Service
metadata:
  name: cbioportal-go-api
  namespace: default
  labels:
    run: cbioportal-go-api
spec:
  selector:
    run: cbioportal-go-api
  ports:
    - port: 80
      name: http
      targetPort: 8080
  type: ClusterIP
---
# Keeps one pod serving while nodes are drained (the cbio-dev spot pool is
# consolidated and replaced often).
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: cbioportal-go-api
  namespace: default
spec:
  minAvailable: 1
  selector:
    matchLabels:
      run: cbioportal-go-api
---
# Scales on CPU (500m request): idle pods use ~20m, whole-study bulk requests
# burst to 0.5-2 cores per pod. With minReplicas 2 the PDB (minAvailable 1)
# keeps one pod serving through spot-node drains.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: cbioportal-go-api
  namespace: default
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: cbioportal-go-api
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
