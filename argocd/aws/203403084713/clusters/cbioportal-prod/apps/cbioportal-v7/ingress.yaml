apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: public-v7-ingress
  namespace: default
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    kubernetes.io/ingress.class: traefik
    traefik.ingress.kubernetes.io/router.middlewares: default-ipblock@kubernetescrd,default-public-v7-noindex@kubernetescrd
spec:
  rules:
  - host: public-v7.cbioportal.org
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: cbioportal-backend-public-v7-green
            port:
              number: 80
  tls:
  - hosts:
    - public-v7.cbioportal.org
    secretName: public-v7-cbio-cert
