# Pass A of the Ensembl 111 GRCh38 vep.annotation backfill: offline cache mode,
# ~99.6% of keys. Delete the Job to re-run; completed shards are skipped.
#
# One VEP process per core, one shard per pod -- NOT one forked process per pod.
# Measured on 4 cores with contiguous input: 4 x --fork=1 gives 428 var/s where
# 1 x --fork=4 gives 257. --fork scales badly (4 forks return 1.49x), so
# parallelism belongs at the pod level, with cpu: 1 letting the scheduler pack
# one pod per core.
#
# Shards come from the prep Job already converted, globally sorted and
# coordinate-contiguous. That ordering is worth ~2.2x (257 vs 116 var/s at
# --fork=4) because VEP's cache is stored per chromosome in position-ordered
# blocks, and VEP rejects unsorted input outright (exit 25).
#
# completions must equal prep's shard count (/work/.shard_count). Too low and
# the trailing shards are never scheduled, with no error anywhere.
apiVersion: batch/v1
kind: Job
metadata:
  name: gn-vep-111-grch38-backfill-pass-a
  namespace: genome-nexus
  labels:
    run: gn-vep-111-grch38-backfill-pass-a
spec:
  completionMode: Indexed
  # One completion per 50k slice: 547 full shards x 5, plus 1 for ens.00547's
  # 39,775-line remainder = 2736. See the slice arithmetic in the script.
  completions: 2736
  # 10 = 4 on cbio-dev (2 nodes, each already ~1.6 cores into cbioportal
  # services) + 6 on ip-10-0-11-224. The 6 is a ceiling, not a target: that
  # node has 7910m allocatable and the mongod it hosts declares no CPU request,
  # so the scheduler would happily pack 7 pods and leave it ~900m.
  parallelism: 10
  # Spot evictions must not consume the retry budget: at 548 shards of ~24-39
  # min on hourly-rotating capacity they alone would exceed any sane limit.
  # Ignore only applies to drains that set DisruptionTarget, so the limit
  # still has to cover ungraceful node loss.
  podFailurePolicy:
    rules:
      - action: Ignore
        onPodConditions:
          - type: DisruptionTarget
  backoffLimit: 400
  template:
    metadata:
      labels:
        run: gn-vep-111-grch38-backfill-pass-a
    spec:
      restartPolicy: Never
      containers:
        - name: worker
          # Backfill image: gn-vep extended + python3 + jq + mongodb-database-tools
          # + hgvsg2ensembl.py. python3 is NOT in the gn-vep image.

          image: genomenexus/gn-vep-backfill:111-grch38-3
          imagePullPolicy: IfNotPresent
          command: ["bash", "-c"]
          args:
            - |
              set -euo pipefail
              W=/work
              CD=/cache-data
              DEST=$CD/homo_sapiens/111_GRCh38
              J="${JOB_COMPLETION_INDEX}"

              # One task annotates a 50k-line SLICE of a prep shard, not a whole
              # 250k shard. A shard is the only resumable unit -- doneA is written
              # at completion, nothing intra-shard -- so a task must finish inside
              # a spot node's life or it restarts from zero forever. Measured:
              # 250k takes 2.4-3.9 h, and ip-10-0-6-33 lived 2.19 h.
              # 250000 / 50000 = 5 exactly, so slices never straddle two shards.
              I=$(printf "%05d" $((J / 5)))
              OFF=$((J % 5))
              S="$W/slice.$J"

              if [ -f "$W/doneA.$J" ]; then echo "slice $J already done"; exit 0; fi
              test -s "$W/ens.$I" || { echo "FAIL: $W/ens.$I missing -- run the prep Job first"; exit 1; }
              sed -n "$((OFF * 50000 + 1)),$(((OFF + 1) * 50000))p" "$W/ens.$I" > "$S"
              test -s "$S" || { echo "FAIL: slice $J of ens.$I is empty"; exit 1; }
              echo "slice $J = ens.$I lines $((OFF * 50000 + 1))-$(((OFF + 1) * 50000)), $(wc -l < "$S") rows"

              # Shards arrive from prep already converted to Ensembl default
              # format, globally sorted and coordinate-contiguous. Nothing to do
              # here but annotate.
              set -o pipefail
              # No --format: VEPController sets format=Optional.empty() in cache
              # mode and lets VEP auto-detect. --format=ensembl is what breaks.
              /opt/vep/src/ensembl-vep/vep \
                --cache --dir_cache=$CD --offline \
                --fasta="$DEST/Homo_sapiens.GRCh38.dna.toplevel.fa.gz" --lookup_ref \
                --everything --hgvsg --no_stats --xref_refseq --json --shift_hgvs=1 \
                --fork=1 \
                --plugin=PolyPhen_SIFT,db=/plugin-data/homo_sapiens_pangenome_PolyPhen_SIFT_20240502.db \
                --plugin=AlphaMissense,file=/plugin-data/AlphaMissense_hg38.tsv.gz \
                --dir_plugins=/plugin-data \
                --input_file="$S" --output_file=STDOUT \
                --warning_file="$W/err.$J.log" \
                | sed -e 's/sift_pred/sift_prediction/g' \
                      -e 's/polyphen_humvar_pred/polyphen_prediction/g' \
                      -e 's/polyphen_humvar_score/polyphen_score/g' \
                | jq -c '._id = .id
                         | ((.allele_string // "") | split("/")) as $a
                         | if ($a | length) == 2 and $a[0] == $a[1]
                           then . + {_ref_eq_alt: true} else . end' \
                | mongoimport --uri "$MONGODB_URI" --collection 'vep.annotation' \
                    --mode upsert --upsertFields _id --numInsertionWorkers 2

              # Straggler accounting: VEP exits 0 with failed variants simply
              # absent from stdout, so record submitted versus skipped.
              { echo "submitted $(wc -l < "$S")"
                echo "vep-skipped $(grep -c skipped "$W/err.$J.log" 2>/dev/null || echo 0)"
              } > "$W/doneA.$J"
              cat "$W/doneA.$J"
              rm -f "$S"
          env:
            - name: MONGODB_URI
              value: "mongodb://gn-mongo-grch38-ensembl111-blue:27017/annotator"
          resources:
            requests:
              # cpu: 1 so the scheduler packs one pod per core, which is the
              # configuration that measured 428 var/s across 4 cores.
              cpu: "1"
              # Measured peak RSS across 10 live pods: 538Mi. At 3Gi memory,
              # not CPU, became the packing constraint on larger nodes.
              memory: 1500Mi
            limits:
              memory: 8Gi
          volumeMounts:
            - name: cache
              mountPath: /cache-data
            - name: work
              mountPath: /work
      volumes:
        - name: cache
          persistentVolumeClaim:
            claimName: gn-vep-111-grch38-cache-efs
        - name: work
          persistentVolumeClaim:
            claimName: gn-vep-111-grch38-work-efs
      # No zone pin: both volumes are EFS, which is multi-AZ.
      #
      # Two placement targets, OR'd -- nodeSelector cannot express that. The
      # gn-db-lg pool is otherwise off limits because its nodes run the
      # production mongos with no resource requests declared, so the scheduler
      # cannot see how full they are; ip-10-0-11-224 is named explicitly
      # because its only co-tenant is this backfill's own write target, which
      # serves no traffic. Do not widen this to the pool label.
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: workload
                    operator: In
                    values: ["cbio-dev"]
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values: ["ip-10-0-11-224.ec2.internal"]
      tolerations:
        - key: "workload"
          operator: "Equal"
          value: "cbio-dev"
          effect: "NoSchedule"
        - key: "workload"
          operator: "Equal"
          value: "gn-db-lg"
          effect: "NoSchedule"
