apiVersion: v1
kind: ServiceAccount
metadata:
  name: cbioportal-chat-sidebar
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cbioportal-chat-sidebar
  labels:
    run: cbioportal-chat-sidebar
spec:
  replicas: 1
  selector:
    matchLabels:
      run: cbioportal-chat-sidebar
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
    type: RollingUpdate
  template:
    metadata:
      labels:
        run: cbioportal-chat-sidebar
    spec:
      containers:
        - name: cbioportal-chat-sidebar
          image: cbioportal/cbioportal-dev:chat-sidebar-sidebar-chat-ai-sdk
          imagePullPolicy: Always
          ports:
            - containerPort: 4000
              protocol: TCP
          envFrom:
            - secretRef:
                name: cbioportal-chat-sidebar
          readinessProbe:
            httpGet:
              path: /api/chat/health
              port: 4000
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/chat/health
              port: 4000
            initialDelaySeconds: 15
            periodSeconds: 20
            failureThreshold: 5
          volumeMounts:
            - mountPath: /home/node/.aws
              name: aws-creds
              readOnly: true
      terminationGracePeriodSeconds: 120
      nodeSelector:
        workload: cbio-dev
      tolerations:
        - effect: NoSchedule
          key: workload
          operator: Equal
          value: cbio-dev
      volumes:
        - name: aws-creds
          secret:
            secretName: k8s-aws-creds-manager
---
apiVersion: v1
kind: Service
metadata:
  name: cbioportal-chat-sidebar
  labels:
    run: cbioportal-chat-sidebar
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 4000
      protocol: TCP
      targetPort: 4000
  selector:
    run: cbioportal-chat-sidebar
