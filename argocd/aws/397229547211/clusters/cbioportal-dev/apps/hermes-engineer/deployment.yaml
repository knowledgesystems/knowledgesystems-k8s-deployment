apiVersion: apps/v1
kind: Deployment
metadata:
  name: engineer
  namespace: cbio-engineer-trial
spec:
  # Stage first; scale to one only after stopping the active external listener.
  replicas: 0
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: engineer
  template:
    metadata:
      labels:
        app: engineer
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      nodeSelector:
        kubernetes.io/arch: amd64
      containers:
        - name: engineer
          image: nousresearch/hermes-agent:v2026.6.5@sha256:9ad3b04ec916ea2c2da22358fd43b024c788d74073210695af88bfc2e63869b4
          args: [hermes, -p, engineering, gateway, run]
          env:
            - name: HERMES_HOME
              value: /opt/data
            - name: HERMES_UID
              value: '10000'
            - name: HERMES_GID
              value: '10000'
            - name: CBIO_MAILING_REPLIES
              value: 'off'
            - name: HERMES_HOME_CHANNEL_REMINDER
              value: 'false'
          envFrom:
            - secretRef:
                name: engineer-env
          resources:
            requests:
              cpu: 500m
              memory: 2Gi
              ephemeral-storage: 1Gi
            limits:
              cpu: '2'
              memory: 4Gi
              ephemeral-storage: 8Gi
          readinessProbe:
            exec:
              command:
                - /opt/hermes/.venv/bin/python
                - -c
                - |
                  from pathlib import Path
                  commands = []
                  for p in Path('/proc').glob('[0-9]*/cmdline'):
                      try:
                          commands.append(p.read_bytes().split(b'\0'))
                      except (FileNotFoundError, ProcessLookupError):
                          pass
                  assert any(b'engineering' in a and b'gateway' in a and b'run' in a and any(x.endswith(b'/hermes') for x in a) for a in commands)
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
          volumeMounts:
            - name: data
              mountPath: /opt/data
              subPath: data
            - name: data
              mountPath: /Users/jko/Code/cbio-engineer/work
              subPath: work
            - name: data
              mountPath: /opt/cbio-claw/vault
              subPath: vault
              readOnly: true
            - name: data
              mountPath: /opt/hermes/gateway/run.py
              subPath: data/runtime-patches/gateway-run.py
              readOnly: true
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: engineer-data
