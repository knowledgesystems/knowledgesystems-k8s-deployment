apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: agentic-cancer-gene-classification
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/knowledgesystems/knowledgesystems-k8s-deployment
    path: argocd/aws/175678591974/clusters/oncokb-research/apps/agentic-cancer-gene-classification
    targetRevision: HEAD
    directory:
      recurse: true
  destination:
    namespace: default
    server: https://kubernetes.default.svc
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
