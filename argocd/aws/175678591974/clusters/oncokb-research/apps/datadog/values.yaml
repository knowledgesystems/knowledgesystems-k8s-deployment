agents:
  podAnnotations:
    container.apparmor.security.beta.kubernetes.io/agent: unconfined
    container.apparmor.security.beta.kubernetes.io/process-agent: unconfined
  enabled: true
  image:
    name: agent
    tag: 7.52.0
  tolerations:
    - key: workload
      operator: Equal
      value: main
      effect: NoSchedule
    - key: workload
      operator: Equal
      value: curation
      effect: NoSchedule
    - key: workload
      operator: Equal
      value: airflow
      effect: NoSchedule
    - key: workload
      operator: Equal
      value: cronjob
      effect: NoSchedule
    - key: workload
      operator: Equal
      value: redis-cl
      effect: NoSchedule
    - key: workload
      operator: Equal
      value: beta
      effect: NoSchedule
    - key: workload
      operator: Equal
      value: nonessential
      effect: NoSchedule
    - key: workload
      operator: Equal
      value: ingress
      effect: NoSchedule
    - key: workload
      operator: Equal
      value: test
      effect: NoSchedule
    # Named agcg, not acgc, matching the eks_managed_node_groups map key in
    # iac/aws/175678591974/clusters/oncokb-research/eks/main.tf (kept as agcg
    # there specifically so Terraform doesn't destroy/recreate the live node
    # group) — this is the dedicated node for
    # apps/agentic-cancer-gene-classification. Without this, the DaemonSet
    # can't schedule onto that node at all, so neither APM traces nor
    # DogStatsD product metrics from that app ever reach an agent.
    - key: workload
      operator: Equal
      value: agcg
      effect: NoSchedule
clusterAgent:
  admissionController:
    enabled: true
    mutateUnlabelled: false
    agentSidecarInjection:
      enabled: true
  podAnnotations:
    container.apparmor.security.beta.kubernetes.io/cluster-agent: unconfined
  tokenExistingSecret: datadog
  createPodDisruptionBudget: true
  enabled: true
  image:
    name: cluster-agent
    tag: 7.52.0
  replicas: 1
datadog:
  logLevel: INFO
  helmCheck:
    enabled: false
    collectEvents: false
  clusterName: oncokb-research-444e139c
  apiKeyExistingSecret: datadog
  clusterChecks:
    enabled: true
  logs:
    containerCollectAll: true
    enabled: true
  apm:
    instrumentation:
      skipKPITelemetry: true
targetSystem: linux
