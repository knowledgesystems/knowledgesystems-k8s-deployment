apiVersion: v1
kind: PersistentVolume
metadata:
  name: cdsi-curation-unpublished-s3-pv
spec:
  capacity:
    storage: 500Gi
  accessModes:
    - ReadOnlyMany
  persistentVolumeReclaimPolicy: Retain
  mountOptions:
    - read-only
    - region us-east-1
  claimRef:
    namespace: airflow
    name: cdsi-curation-unpublished-s3-pvc
  csi:
    driver: s3.csi.aws.com
    volumeHandle: cdsi-curation-unpublished
    volumeAttributes:
      bucketName: cdsi-curation-unpublished
      authenticationSource: pod
      stsRegion: us-east-1
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: cdsi-curation-unpublished-s3-pvc
  namespace: airflow
spec:
  accessModes:
    - ReadOnlyMany
  storageClassName: ""
  resources:
    requests:
      storage: 500Gi
  volumeName: cdsi-curation-unpublished-s3-pv
