apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: slide-viewer-triage
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/knowledgesystems/knowledgesystems-k8s-deployment
    path: argocd/aws/666628074417/clusters/cbioportal-prod/apps/slide-viewer-triage
    targetRevision: HEAD
    directory:
      recurse: true
  destination:
    namespace: default
    server: https://kubernetes.default.svc
  revisionHistoryLimit: 3
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
