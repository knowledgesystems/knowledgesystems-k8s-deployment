apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: cbioportal-tile-server-ingress-only
  namespace: default
spec:
  podSelector:
    matchLabels:
      app: cbioportal-tile-server
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
