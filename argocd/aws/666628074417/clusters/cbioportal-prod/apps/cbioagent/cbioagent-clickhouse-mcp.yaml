apiVersion: apps/v1
kind: Deployment
metadata:
  name: cbioagent-clickhouse-mcp
  labels:
    run: cbioagent-clickhouse-mcp
  annotations:
    # Reloader (stakater) rolls this Deployment when clickhouse-mcp-active
    # changes — the daily clone cron flips that ConfigMap's
    # CLICKHOUSE_DATABASE on each successful build.
    configmap.reloader.stakater.com/reload: "clickhouse-mcp-active"
    # Roll when the LibreChat bridge secret is rotated (and created, if
    # Reloader runs with --reload-on-create).
    secret.reloader.stakater.com/reload: "cbioportal-mcp-bridge"
    # Keel polls Docker Hub for `cbioportal/mcp:latest` and rolls the
    # Deployment when the digest changes. Without this, `:latest` only
    # gets re-pulled when the pod restarts for other reasons (daily clone
    # via Reloader, evictions), so MCP-server fixes can lag by up to a
    # day even though `imagePullPolicy: Always` is set.
    keel.sh/policy: force
    keel.sh/trigger: poll
    keel.sh/match-tag: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      run: cbioagent-clickhouse-mcp
  template:
    metadata:
      labels:
        run: cbioagent-clickhouse-mcp
    spec:
      containers:
        - name: cbioagent-clickhouse-mcp
          image: cbioportal/mcp:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          env:
            - name: DD_AGENT_HOST
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
            - name: OTEL_SERVICE_NAME
              value: "cbioportal-mcp"
            - name: DD_LLMOBS_ML_APP
              value: "cbioportal-mcp"
            - name: DD_SITE
              value: "datadoghq.com"
            # Mount FastMCP under the external sub-path so trailing-slash
            # redirects point to https://chat.cbioportal.aws.mskcc.org/db/mcp/
            # rather than /mcp/. Paired with the cbioagent-db-ingress
            # Ingress in this app: NO rewrite-target so the app sees the
            # full external path.
            - name: CLICKHOUSE_MCP_HTTP_PATH
              value: "/db/mcp"
            # Trust X-Forwarded-* from any in-cluster source so uvicorn's
            # 307 trailing-slash redirect honors Traefik's
            # X-Forwarded-Proto: https. Without this the Location
            # downgrades to http:// and strict clients (Claude Desktop,
            # etc.) refuse to follow. The listener is only reachable via
            # in-cluster Services, so "*" is fine.
            - name: CLICKHOUSE_MCP_FORWARDED_ALLOW_IPS
              value: "*"
            # Upcoming cbioportal-mcp releases refuse to start unless this is
            # set explicitly (on|off, no default). `off` = current behavior
            # (no per-user study filtering). Ignored by current images.
            - name: CBIOPORTAL_MCP_STUDY_FILTERING
              value: "off"
            # Upcoming cbioportal-mcp releases refuse to start unless this is
            # set explicitly (off|enforce, no default). One switch for
            # mandatory login + LibreChat bridge-secret check + verified-email
            # check. `off` = current behavior. Flip to `enforce` via a git
            # change + Argo sync (pod rolls). Ignored by current images.
            - name: CBIOPORTAL_MCP_AUTH_ENFORCEMENT
              value: "off"
            # Required by upcoming images, no default. Comma-separated tester
            # emails (case-insensitive); while AUTH_ENFORCEMENT is off,
            # identified testers get the full new checks. Empty string = no
            # testers, set explicitly. Ignored by current images.
            - name: CBIOPORTAL_MCP_AUTH_TEST_USERS
              value: ""
            # Required by upcoming images, no default (off|enforce). When
            # `enforce`, the server refuses to start if a filtering-off DB has
            # public=0 studies, unknown groups, or authorities rows. Ignored
            # by current images.
            - name: CBIOPORTAL_MCP_PUBLIC_DB_CHECK
              value: "off"
            # Shared secret LibreChat sends in the
            # x-cbioportal-mcp-bridge-secret header (see librechat-config.yaml).
            # Upcoming cbioportal-mcp releases require it to trust the
            # x-user-* identity headers. Secret is created out of band
            # (portal-configuration); optional so the pod still starts before
            # it exists. Ignored by current images.
            - name: CBIOPORTAL_MCP_BRIDGE_SECRET
              valueFrom:
                secretKeyRef:
                  name: cbioportal-mcp-bridge
                  key: CBIOPORTAL_MCP_BRIDGE_SECRET
                  optional: true
          envFrom:
            - secretRef:
                name: clickhouse-mcp
            # ConfigMap mounted AFTER the Secret so its CLICKHOUSE_DATABASE
            # value wins (envFrom: last-writer-wins on key collisions). The
            # cbioagent-clickhouse-clone-daily CronJob owns this ConfigMap
            # and updates it when the production color flips, then rolls
            # this Deployment.
            - configMapRef:
                name: clickhouse-mcp-active
          volumeMounts:
            # MSK study guides (lives in portal-configuration). Overlays
            # the image's baked-in study-guides directory so the MCP's
            # _load_study_guide(study_id) returns MSK content (e.g.
            # mskimpact.md) instead of the public-portal guides.
            - mountPath: /app/src/cbioportal_mcp/resources/study-guides
              name: study-guides
              readOnly: true
            # MSK general guides surfaced via the MCP's
            # get_general_guide(name) tool — e.g. cdsi-info on CDSI data
            # provenance.
            - mountPath: /app/src/cbioportal_mcp/resources/guides
              name: general-guides
              readOnly: true
      volumes:
        - name: study-guides
          configMap:
            name: cbioagent-study-guides-msk
        - name: general-guides
          configMap:
            name: cbioagent-general-guides-msk
      nodeSelector:
        workload: "cbioagent"
      tolerations:
        - key: "workload"
          operator: "Equal"
          value: "cbioagent"
          effect: "NoSchedule"
---
apiVersion: v1
kind: Service
metadata:
  name: cbioagent-clickhouse-mcp
spec:
  selector:
    run: cbioagent-clickhouse-mcp
  ports:
    - port: 80
      name: http
      targetPort: 8000
  type: ClusterIP
