# The MSK portals' identity for reading the msk-static-files bucket. IRSA maps
# it to userServiceRoleMskStaticFilesReader (iac/.../cbioportal-prod/iam),
# which can only list and read that bucket. Pods using it annotate
# eks.amazonaws.com/skip-containers so only their static-files-sync sidecar
# gets the credentials.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: msk-static-files-reader
  namespace: default
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::666628074417:role/userServiceRoleMskStaticFilesReader
