apiVersion: apps/v1
kind: Deployment
metadata:
  name: slide-viewer-triage
  namespace: default
  labels:
    app: slide-viewer-triage
spec:
  replicas: 2
  selector:
    matchLabels:
      app: slide-viewer-triage
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: slide-viewer-triage
      annotations:
        # Restart the pod when the ConfigMap-backed CORS allowlist changes.
        # Force a clean beta block cache after source-region tile failures.
        slide-viewer-cache-revision: "2026-08-31-native-overview-cache-recovery"
        slide-viewer-config-revision: "2026-08-28-wsi-cache-repair-config"
        ad.datadoghq.com/tile-server.checks: >-
          {"openmetrics":{"init_config":{},"instances":[{"openmetrics_endpoint":"http://%%host%%:8080/metrics","namespace":"wsi_tile_server","metrics":["tile_server_.*"]}]}}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      nodeSelector:
        workload: tile-viewer
      tolerations:
        - effect: NoSchedule
          key: workload
          operator: Equal
          value: tile-viewer
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: slide-viewer-triage
      terminationGracePeriodSeconds: 60
      imagePullSecrets:
        - name: dockerhub-creds
      containers:
        - name: tile-server
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop:
                - ALL
          # Main 8843009 is pinned to its immutable multi-architecture digest.
          image: cbioportal/cbioportal-tile-server:main@sha256:216729fb295ed3e912b4f9905de59b2aabd8bca702f921f994f33b58d2fff822
          imagePullPolicy: Always
          resources:
            requests:
              memory: 8Gi
            limits:
              memory: 16Gi
          ports:
            - containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: slide-viewer-triage-config
          env:
            - name: CACHE_MISS_LOCK_TTL_SECONDS
              value: "120"
            - name: CACHE_MISS_WAIT_TIMEOUT_SECONDS
              value: "30"
            - name: GUNICORN_TIMEOUT
              value: "60"
            - name: CORS_ORIGINS
              value: "https://beta.cbioportal.mskcc.org,https://deploy-preview-5608.preview.cbioportal.org,https://deploy-preview-5608--cbioportalfrontend.netlify.app"
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: slide-viewer-secrets
                  key: AWS_ACCESS_KEY_ID
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: slide-viewer-secrets
                  key: AWS_SECRET_ACCESS_KEY
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: slide-viewer-secrets
                  key: REDIS_URL
            - name: WSI_AUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: cbioportal-wsi-auth
                  key: WSI_AUTH_SECRET
          volumeMounts:
            - name: slide-block-cache
              mountPath: /cache/slide-blocks
            - name: prometheus-cache
              mountPath: /cache/prometheus
            - name: tmp
              mountPath: /tmp
          startupProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 2
            timeoutSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
      volumes:
        - name: slide-block-cache
          emptyDir:
            sizeLimit: 16Gi
        - name: prometheus-cache
          emptyDir:
            sizeLimit: 256Mi
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi

---
apiVersion: v1
kind: Service
metadata:
  name: slide-viewer-triage
  namespace: default
  labels:
    app: slide-viewer-triage
spec:
  selector:
    app: slide-viewer-triage
  ports:
    - name: http
      port: 80
      targetPort: 8080
      protocol: TCP
