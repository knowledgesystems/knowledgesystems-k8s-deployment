apiVersion: apps/v1
kind: Deployment
metadata:
  name: slide-viewer-triage
  namespace: default
  labels:
    app: slide-viewer-triage
spec:
  replicas: 1
  selector:
    matchLabels:
      app: slide-viewer-triage
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: slide-viewer-triage
      annotations:
        configmap.reloader.stakater.com/reload: slide-viewer-triage-config
        secret.reloader.stakater.com/reload: slide-viewer-secrets,cbioportal-wsi-auth
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      nodeSelector:
        workload: cbio-triage
      tolerations:
        - effect: NoSchedule
          key: workload
          operator: Equal
          value: cbio-triage
      terminationGracePeriodSeconds: 60
      imagePullSecrets:
        - name: dockerhub-creds
      containers:
        - name: tile-server
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          image: cbioportal/cbioportal-tile-server:c602272a5c0d872d76d7a36940cc9ec14e28a8db
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: slide-viewer-triage-config
          env:
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: slide-viewer-secrets
                  key: AWS_ACCESS_KEY_ID
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: slide-viewer-secrets
                  key: AWS_SECRET_ACCESS_KEY
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: slide-viewer-secrets
                  key: REDIS_URL
            - name: WSI_AUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: cbioportal-wsi-auth
                  key: WSI_AUTH_SECRET
          resources:
            requests:
              memory: "4Gi"
              cpu: "250m"
              ephemeral-storage: "2Gi"
            limits:
              memory: "16Gi"
              cpu: "2"
              ephemeral-storage: "20Gi"
          volumeMounts:
            - name: slide-block-cache
              mountPath: /cache/slide-blocks
            - name: prometheus-cache
              mountPath: /cache/prometheus
          startupProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 2
            timeoutSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
      volumes:
        - name: slide-block-cache
          emptyDir:
            sizeLimit: 16Gi
        - name: prometheus-cache
          emptyDir:
            sizeLimit: 256Mi

---
apiVersion: v1
kind: Service
metadata:
  name: slide-viewer-triage
  namespace: default
  labels:
    app: slide-viewer-triage
spec:
  selector:
    app: slide-viewer-triage
  ports:
    - name: http
      port: 80
      targetPort: 8080
      protocol: TCP
