apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: slide-viewer-triage-wsi-ingress
  namespace: default
  annotations:
    nginx.ingress.kubernetes.io/backend-protocol: HTTP
    nginx.ingress.kubernetes.io/proxy-body-size: 1m
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "10"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
    nginx.ingress.kubernetes.io/limit-rps: "100"
    nginx.ingress.kubernetes.io/limit-burst-multiplier: "5"
    # Allow approximately six browser connections for each of 50 concurrent
    # users behind one NAT address. The tile server still bounds expensive
    # image work independently with MAX_IMAGE_OPERATIONS.
    nginx.ingress.kubernetes.io/limit-connections: "300"
    # Keep a slide's cold-open cache and SlideCache affinity on one pod.
    nginx.ingress.kubernetes.io/upstream-hash-by: "$http_x_wsi_source"
    # The browser uses a same-origin /wsi route while the FastAPI application
    # owns root-level /tiles, /thumbnails, /health, and /ready paths.
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/rewrite-target: /$2
spec:
  ingressClassName: nginx
  rules:
    - host: beta.cbioportal.mskcc.org
      http:
        paths:
          # Keep the allowlist explicit: do not expose metrics, OpenAPI, or
          # any future application route through the public ingress.
          - path: /wsi(/|$)(tiles(/.*)?|thumbnails(/.*)?|health|ready)$
            pathType: ImplementationSpecific
            backend:
              service:
                name: slide-viewer-triage
                port:
                  number: 80
