apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: slide-viewer-triage-ingress-only
  namespace: default
spec:
  podSelector:
    matchLabels:
      app: slide-viewer-triage
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
